name: Repair empty-turn implementation workflow

on:
  push:
    branches: [fix/empty-assistant-turn-loop]
    paths:
      - .github/workflows/repair-empty-turn-workflow.yml

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/empty-assistant-turn-loop
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Remove nested template literals from patch generator
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const file = '.github/workflows/sync-empty-turn-fix.yml'
          let text = fs.readFileSync(file, 'utf8')
          const brokenToast = '        await toast(client, `Loop paused after ${empty.count} consecutive completed assistant turns with no visible output or tool activity. Resume after changing the model/prompt or use /loop-resume.`, "warning")'
          const fixedToast = '        await toast(client, "Loop paused after " + empty.count + " consecutive completed assistant turns with no visible output or tool activity. Resume after changing the model/prompt or use /loop-resume.", "warning")'
          const brokenKey = 'const key = (directory, sessionID) => `${directory}:${sessionID}`'
          const fixedKey = 'const key = (directory, sessionID) => String(directory) + ":" + String(sessionID)'
          if (!text.includes(brokenToast)) throw new Error('broken toast marker not found')
          if (!text.includes(brokenKey)) throw new Error('broken key marker not found')
          text = text.replace(brokenToast, fixedToast).replace(brokenKey, fixedKey)
          fs.writeFileSync(file, text)
          NODE
      - name: Commit repaired implementation workflow
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/sync-empty-turn-fix.yml
          git commit -m "ci: fix empty-turn patch generator quoting"
          git push origin HEAD:fix/empty-assistant-turn-loop
