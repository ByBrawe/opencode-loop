name: Sync stable status bundle

on:
  push:
    branches:
      - fix/stable-status-no-now-due
    paths:
      - ".github/workflows/sync-stable-status-bundle.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/stable-status-no-now-due
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run build:plugin
      - name: Commit generated bundle and remove helper
        run: |
          rm .github/workflows/sync-stable-status-bundle.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/index.js .github/workflows/sync-stable-status-bundle.yml
          git commit -m "build: sync stable status bundle"
          git push origin HEAD:fix/stable-status-no-now-due
