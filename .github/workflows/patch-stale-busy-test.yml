name: Patch stale busy test timing

on:
  push:
    branches:
      - test/stable-loop-now-real-host
    paths:
      - ".github/workflows/patch-stale-busy-test.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/stable-loop-now-real-host
      - name: Patch comprehensive stale-busy timing
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/comprehensive-test.mjs')
          s = p.read_text()
          old = '''    h.messageHistory.splice(0, h.messageHistory.length,\n      { info: { id: "usr_tail", sessionID: h.sessionID, role: "user", time: { created: completedAt - 2 } }, parts: [] },\n      { info: { id: "asst_tail", sessionID: h.sessionID, role: "assistant", time: { created: completedAt - 1, completed: completedAt } }, parts: [] },\n    )\n    await h.command("loop-now", "stale-complete")\n'''
          new = '''    h.messageHistory.splice(0, h.messageHistory.length,\n      { info: { id: "usr_tail", sessionID: h.sessionID, role: "user", time: { created: completedAt - 2 } }, parts: [] },\n      { info: { id: "asst_tail", sessionID: h.sessionID, role: "assistant", time: { created: completedAt - 1, completed: completedAt } }, parts: [] },\n    )\n    // Let the short busy-status cache expire so the scheduler re-reads live host state\n    // and can reconcile the completed assistant tail instead of trusting cached busy.\n    await delay(1_700)\n    await h.command("loop-now", "stale-complete")\n'''
          if old not in s:
              raise SystemExit('target stale-complete block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove helper
        run: |
          rm .github/workflows/patch-stale-busy-test.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/comprehensive-test.mjs .github/workflows/patch-stale-busy-test.yml
          git commit -m "test: align stale-busy recovery with scheduler cache"
          git push origin HEAD:test/stable-loop-now-real-host
