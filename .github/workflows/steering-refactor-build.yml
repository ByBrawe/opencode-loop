name: Temporary Goal Steering Build

on:
  push:
    branches:
      - fix/loop-goal-user-steering
    paths:
      - scripts/goal-steering-refactor-ready.txt

permissions:
  contents: write

jobs:
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - name: Update comprehensive steering contract
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFile, writeFile } from "node:fs/promises"
          const file = "scripts/comprehensive-test.mjs"
          const source = await readFile(file, "utf8")
          const before = 'assert.equal(state.jobs[0].paused, true, "a distinct real user message must still pause an active goal")'
          const after = 'assert.equal(state.jobs[0].paused, false, "a distinct real user message must steer an active goal without pausing it")'
          if (!source.includes(before)) throw new Error("old user-interrupt assertion was not found")
          await writeFile(file, source.replace(before, after), "utf8")
          NODE
      - run: node --check src/source/runtime/goal-steering.js
      - run: node scripts/goal-steering-test.mjs
      - run: npm run build:plugin
      - run: npm run check
      - run: npm test
      - name: Commit verified steering changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js scripts/comprehensive-test.mjs
          if git diff --cached --quiet; then
            echo "verified files already match source"
            exit 0
          fi
          git commit -m "test: align queued Goal steering contract"
          git push origin HEAD:fix/loop-goal-user-steering
