name: OpenCode 2 Discovery Diagnostics

on:
  push:
    branches: [experimental-opencode2]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false @opencode-ai/plugin@next
      - run: npm install --global @opencode-ai/cli@next
      - name: Inspect V2 command transport operations
        shell: bash
        run: |
          project="$RUNNER_TEMP/opencode2-discovery"
          mkdir -p "$project/.opencode/plugins"
          git init -q "$project"
          target="$(node -e 'const {pathToFileURL}=require("node:url"); process.stdout.write(pathToFileURL(process.argv[1]).href)' "$GITHUB_WORKSPACE/src/source/opencode2/experimental.js")"
          quoted="$(node -e 'process.stdout.write(JSON.stringify(process.argv[1]))' "$target")"
          printf 'export { default } from %s\n' "$quoted" > "$project/.opencode/plugins/opencode-loop-v2.js"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$project/node_modules"
          printf '{}\n' > "$project/opencode.json"
          git -C "$project" config user.email "canary@example.invalid"
          git -C "$project" config user.name "OpenCode Canary"
          git -C "$project" add .opencode opencode.json
          git -C "$project" commit -qm init
          opencode2 service stop >/dev/null 2>&1 || true
          encoded="$(node -e 'process.stdout.write(encodeURIComponent(process.argv[1]))' "$project")"
          query="directory=$encoded&location%5Bdirectory%5D=$encoded"
          body="$(node -e 'process.stdout.write(JSON.stringify({location:{directory:process.argv[1]}}))' "$project")"
          cd "$project"
          opencode2 api post "/api/session?$query" --data "$body"
          spec_file="$RUNNER_TEMP/opencode2-openapi.json"
          opencode2 api get /openapi.json > "$spec_file"
          node -e 'const fs=require("fs"); const s=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); for (const [p,ops] of Object.entries(s.paths||{})) for (const [m,op] of Object.entries(ops||{})) { const text=(p+" "+String(op?.operationId||"")+" "+String(op?.summary||"")).toLowerCase(); if (text.includes("command") || text.includes("prompt") || text.includes("input")) console.log(JSON.stringify({path:p,method:m,operationId:op?.operationId,summary:op?.summary})) }' "$spec_file"
          opencode2 service stop >/dev/null 2>&1 || true
