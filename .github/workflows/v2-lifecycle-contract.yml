name: V2 Lifecycle Contract

on:
  pull_request:
    paths:
      - "src/source/opencode2/**"
      - "src/source/runtime/**"
      - "scripts/v2-event-bridge-test.mjs"
      - "scripts/v2-event-stream-contract-test.mjs"
      - "scripts/v2-host-contract-test.mjs"
      - "scripts/v2-runtime-adapter-test.mjs"
      - "scripts/v2-plugin-sentinel-test.mjs"
      - "scripts/v2-prompt-runtime-test.mjs"
      - "scripts/v2-prompt-interval-test.mjs"
      - "scripts/v2-command-runtime-test.mjs"
      - "scripts/v2-command-adapter-test.mjs"
      - "scripts/v2-diagnostics-test.mjs"
      - "scripts/v2-logging-test.mjs"
      - ".github/workflows/v2-lifecycle-contract.yml"
  push:
    branches: [main]
    paths:
      - "src/source/opencode2/**"
      - "src/source/runtime/**"
      - "scripts/v2-event-bridge-test.mjs"
      - "scripts/v2-event-stream-contract-test.mjs"
      - "scripts/v2-host-contract-test.mjs"
      - "scripts/v2-runtime-adapter-test.mjs"
      - "scripts/v2-plugin-sentinel-test.mjs"
      - "scripts/v2-prompt-runtime-test.mjs"
      - "scripts/v2-prompt-interval-test.mjs"
      - "scripts/v2-command-runtime-test.mjs"
      - "scripts/v2-command-adapter-test.mjs"
      - "scripts/v2-diagnostics-test.mjs"
      - "scripts/v2-logging-test.mjs"
      - ".github/workflows/v2-lifecycle-contract.yml"

permissions:
  contents: read

jobs:
  lifecycle-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node --check src/source/opencode2/commands.js
      - run: node --check src/source/opencode2/events.js
      - run: node --check src/source/opencode2/event-bridge.js
      - run: node --check src/source/opencode2/host-contract.js
      - run: node --check src/source/opencode2/runtime-adapter.js
      - run: node --check src/source/opencode2/prompt-runtime.js
      - run: node --check src/source/opencode2/diagnostics.js
      - run: node --check src/source/opencode2/logging.js
      - run: node --check src/source/opencode2/experimental.js
      - run: node --check scripts/v2-event-bridge-test.mjs
      - run: node --check scripts/v2-event-stream-contract-test.mjs
      - run: node --check scripts/v2-host-contract-test.mjs
      - run: node --check scripts/v2-runtime-adapter-test.mjs
      - run: node --check scripts/v2-prompt-runtime-test.mjs
      - run: node --check scripts/v2-prompt-interval-test.mjs
      - run: node --check scripts/v2-command-runtime-test.mjs
      - run: node --check scripts/v2-command-adapter-test.mjs
      - run: node --check scripts/v2-diagnostics-test.mjs
      - run: node --check scripts/v2-logging-test.mjs
      - run: node scripts/v2-event-bridge-test.mjs
      - run: node scripts/v2-event-stream-contract-test.mjs
      - run: node scripts/v2-host-contract-test.mjs
      - run: node scripts/v2-runtime-adapter-test.mjs
      - run: node scripts/v2-prompt-runtime-test.mjs
      - run: node scripts/v2-prompt-interval-test.mjs
      - run: node scripts/v2-command-runtime-test.mjs
      - run: node scripts/v2-command-adapter-test.mjs
      - run: node scripts/v2-diagnostics-test.mjs
      - run: node scripts/v2-logging-test.mjs
      - run: node scripts/v2-plugin-sentinel-test.mjs
