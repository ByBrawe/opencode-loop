name: OpenCode 2 Exact Contract

on:
  push:
    branches: [v2-real-host-sentinel]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install exact packages
        run: npm install --no-save --package-lock=false @opencode-ai/cli@0.0.0-next-17430 @opencode-ai/plugin@0.0.0-next-17430 @opencode-ai/schema@0.0.0-next-17430
      - name: Show exact plugin API contract
        run: |
          sed -n '1,280p' node_modules/@opencode-ai/plugin/dist/promise/index.d.ts
          sed -n '1,360p' node_modules/@opencode-ai/plugin/dist/promise/plugin.d.ts
          sed -n '1,360p' node_modules/@opencode-ai/plugin/dist/promise/command.d.ts
      - name: Show exact plugin config schema
        run: |
          sed -n '1,360p' node_modules/@opencode-ai/schema/dist/config/plugin.d.ts
          sed -n '1,360p' node_modules/@opencode-ai/schema/dist/config/plugin.js
          sed -n '60,120p' node_modules/@opencode-ai/schema/dist/config.d.ts
          sed -n '85,115p' node_modules/@opencode-ai/schema/dist/config.js
