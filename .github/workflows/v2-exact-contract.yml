name: OpenCode 2 Exact Contract

on:
  push:
    branches: [v2-real-host-sentinel]

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install exact packages
        run: npm install --no-save --package-lock=false @opencode-ai/cli@0.0.0-next-17430 @opencode-ai/plugin@0.0.0-next-17430
      - name: Show plugin package manifest
        run: cat node_modules/@opencode-ai/plugin/package.json
      - name: Show promise API entry declarations
        run: sed -n '1,280p' node_modules/@opencode-ai/plugin/dist/promise/index.d.ts
      - name: Show promise plugin declarations
        run: sed -n '1,360p' node_modules/@opencode-ai/plugin/dist/promise/plugin.d.ts
      - name: Show promise plugin implementation
        run: sed -n '1,320p' node_modules/@opencode-ai/plugin/dist/promise/plugin.js
      - name: Show registration declarations
        run: sed -n '1,320p' node_modules/@opencode-ai/plugin/dist/promise/registration.d.ts
      - name: Show CLI package manifest
        run: cat node_modules/@opencode-ai/cli/package.json
