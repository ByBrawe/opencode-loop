name: Temporary run finalization artifact

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      - name: Apply extraction
        run: node scripts/refactor-run-finalization.mjs

      - name: Rebuild stable single-file entry
        run: npm run build:plugin

      - name: Verify syntax and regressions
        run: |
          npm run check
          npm test
          git diff --check

      - uses: actions/upload-artifact@v4
        with:
          name: run-finalization-refactor
          path: |
            package.json
            src/source/runtime/executor.js
            src/index.js
          if-no-files-found: error
