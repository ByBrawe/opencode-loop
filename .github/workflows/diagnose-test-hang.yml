name: Diagnose Test Hang

on:
  push:
    branches: [diagnose-test-hang]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: v2-runtime-scope
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run check
      - name: Verify V2 runtime contracts
        run: |
          node --check src/source/runtime/session-registry.js
          node --check src/source/runtime/scope.js
          node --check scripts/runtime-contract-test.mjs
          node --check scripts/runtime-scope-test.mjs
          node scripts/runtime-contract-test.mjs
          node scripts/runtime-scope-test.mjs
      - run: npm test
      - name: Verify stable V1 bundle remains unchanged
        shell: bash
        run: |
          npm run build:plugin
          git diff --exit-code -- src/index.js
      - run: bun -e "await import('./src/index.js')"
