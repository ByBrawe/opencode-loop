name: Temporary Queued Steering Bundle Build

on:
  push:
    branches:
      - test/loop-goal-queued-steering-host
    paths:
      - scripts/queued-steering-build-ready.txt

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: npm run build:plugin
      - run: npm run check
      - run: node scripts/goal-steering-test.mjs
      - name: Commit generated bundle
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js
          git diff --cached --quiet && exit 0
          git commit -m "build: regenerate pre-dispatch steering bundle"
          git push origin HEAD:test/loop-goal-queued-steering-host
