name: V2 lifetime hardening pass
on:
  push:
    branches: [main]
    paths: [.github/workflows/v2-lifetime-pass.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-lifetime-hardening-main
  cancel-in-progress: false
jobs:
  verify-and-commit:
    if: github.repository == 'ByBrawe/opencode-loop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - name: Add native lifetime regressions
        shell: bash
        run: |
          cat > scripts/native-plugin-lifetime-test.mjs <<'TEST'
          import test from "node:test"
          import assert from "node:assert/strict"
          import { mkdtemp, rm } from "node:fs/promises"
          import os from "node:os"
          import path from "node:path"
          import plugin from "../src/source/opencode2/native-plugin.js"

          function fixture(directory, { failCleanup = false } = {}) {
            const released = []
            let releaseRead, signal
            let streamClosed = false
            const end = () => releaseRead?.()
            const registration = (name) => ({ async dispose() {
              released.push(name)
              if (failCleanup && name === "commands") throw new Error("cleanup sentinel")
            } })
            const ctx = {
              location: { directory }, options: {}, app: { version: "2.0.18" },
              session: {
                prompt: async () => { throw new Error("cleanup must not dispatch a prompt") },
                hook: async (name) => registration(name),
              },
              command: { transform: async () => registration("commands") },
              event: { subscribe(options = {}) {
                signal = options.signal
                return (async function* () {
                  try {
                    await new Promise((resolve) => {
                      releaseRead = resolve
                      if (signal?.aborted) resolve()
                      else signal?.addEventListener("abort", resolve, { once: true })
                    })
                  } finally { streamClosed = true }
                })()
              } },
            }
            return { ctx, end, released, signal: () => signal, streamClosed: () => streamClosed }
          }

          async function bounded(promise) {
            let timer
            try {
              return await Promise.race([
                promise.then(() => "closed"),
                new Promise((resolve) => { timer = setTimeout(() => resolve("timeout"), 500) }),
              ])
            } finally { clearTimeout(timer) }
          }

          test("native Loop aborts an idle subscription before awaiting iterator return", async () => {
            const directory = await mkdtemp(path.join(os.tmpdir(), "loop-v2-lifetime-"))
            const host = fixture(directory)
            let closing
            try {
              const dispose = await plugin.setup(host.ctx)
              closing = dispose()
              assert.equal(await bounded(closing), "closed", "idle subscription cleanup requires an AbortSignal")
              assert.equal(host.signal()?.aborted, true)
              assert.equal(host.streamClosed(), true)
              assert.deepEqual(host.released, ["commands", "compaction", "prompt"])
            } finally {
              host.end()
              await closing?.catch(() => {})
              await rm(directory, { recursive: true, force: true, maxRetries: 5, retryDelay: 20 })
            }
          })

          test("native Loop cleanup is shared and drains all registrations after an error", async () => {
            const directory = await mkdtemp(path.join(os.tmpdir(), "loop-v2-cleanup-error-"))
            const host = fixture(directory, { failCleanup: true })
            let closing
            try {
              const dispose = await plugin.setup(host.ctx)
              host.end()
              closing = dispose()
              const observed = closing.catch((error) => error)
              assert.strictEqual(dispose(), closing, "concurrent unloads must await the same cleanup")
              const error = await observed
              assert.ok(error instanceof AggregateError)
              assert.match(String(error.errors[0]), /cleanup sentinel/)
              assert.deepEqual(host.released, ["commands", "compaction", "prompt"])
              assert.equal(host.streamClosed(), true)
            } finally {
              host.end()
              await closing?.catch(() => {})
              await rm(directory, { recursive: true, force: true, maxRetries: 5, retryDelay: 20 })
            }
          })

          test("native Loop uses the same public plugin identity as the package entry", () => {
            assert.equal(plugin.id, "@bybrawe/opencode-loop")
          })
          TEST
      - name: Prove the existing idle-unload defect before changing source
        shell: bash
        run: |
          if node --test scripts/native-plugin-lifetime-test.mjs > "$RUNNER_TEMP/loop-lifetime-before.log" 2>&1; then
            cat "$RUNNER_TEMP/loop-lifetime-before.log"
            echo 'Expected the original native lifetime regression to fail.'
            exit 1
          fi
          cat "$RUNNER_TEMP/loop-lifetime-before.log"
          grep -q 'idle subscription cleanup requires an AbortSignal' "$RUNNER_TEMP/loop-lifetime-before.log"
      - name: Apply reviewed native-only lifecycle changes
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync, writeFileSync } from 'node:fs'
          import assert from 'node:assert/strict'
          function edit(file, before, after) {
            const source = readFileSync(file, 'utf8')
            assert.equal(source.split(before).length, 2, `Expected one unchanged anchor in ${file}: ${before}`)
            writeFileSync(file, source.replace(before, after))
          }
          const file = 'src/source/opencode2/native-plugin.js'
          edit(file, 'id: "bybrawe.opencode-loop.native",', 'id: "@bybrawe/opencode-loop",')
          edit(file, '    const registrations = []', '    const registrations = []\n    const eventAbort = new AbortController()')
          edit(file, 'await bridge.attach(() => ctx.event.subscribe())', 'await bridge.attach(() => ctx.event.subscribe({ signal: eventAbort.signal }))')
          edit(file,
            'onEvent: (event) => runtime.onEvent(event), onError: (error) => { void appendLoopLog(directory, "v2-native-event-error", { message: String(error?.message || error) }) }',
            'onEvent: (event) => eventAbort.signal.aborted ? undefined : runtime.onEvent(event), onError: (error) => { if (!eventAbort.signal.aborted) void appendLoopLog(directory, "v2-native-event-error", { message: String(error?.message || error) }).catch(() => {}) }')
          edit(file,
            'onError: (error) => { void appendLoopLog(directory, "v2-native-error", { message: String(error?.message || error) }) },',
            'onError: (error) => { void appendLoopLog(directory, "v2-native-error", { message: String(error?.message || error) }).catch(() => {}) },')
          edit(file, `    let closed = false
              async function dispose() {
                if (closed) return
                closed = true
                await runtime.dispose()
                await shellHost.dispose()
                await bridge.dispose("native-plugin-disposed")
                for (const registration of registrations.reverse()) await cleanup(registration)
              }`, `    let closed = false
              let closeTask
              function dispose() {
                if (closeTask) return closeTask
                closed = true
                // Publish one cleanup promise before abort listeners can re-enter.
                closeTask = Promise.resolve().then(async () => {
                  const failures = []
                  const steps = [
                    () => runtime.dispose(),
                    () => shellHost.dispose(),
                    () => bridge.dispose("native-plugin-disposed"),
                    ...registrations.reverse().map((registration) => () => cleanup(registration)),
                  ]
                  for (const step of steps) {
                    try { await step() } catch (error) { failures.push(error) }
                  }
                  if (failures.length) throw new AggregateError(failures, "Native Loop cleanup failed")
                })
                // Async-generator return() cannot interrupt a pending next().
                // Cancel the actual V2 subscription before waiting for the bridge.
                eventAbort.abort()
                return closeTask
              }`)
          edit('scripts/native-entry-test.mjs', 'assert.equal(typeof plugin.id, "string", entry);', 'assert.equal(plugin.id, "'+JSON.parse(readFileSync('package.json')).name+'", entry);')
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'))
          pkg.scripts.test = 'node --test scripts/native-plugin-lifetime-test.mjs && ' + pkg.scripts.test
          pkg.scripts.check += ' && node --check scripts/native-plugin-lifetime-test.mjs'
          writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          JS
      - name: Build and verify the actual shipping bundles
        shell: bash
        run: |
          npm run build:plugin
          npm run check
          npm test
          npm run package:smoke
          npm pack --dry-run
      - name: Record the joint migration plan and first verified increment
        shell: bash
        run: |
          mkdir -p docs
          cat > docs/opencode2-migration-plan.md <<'PLAN'
          # OpenCode 2 migration: Loop and Goal

          Started: 2026-09-29. Work directly on main; do not create repair branches.
          Baseline: Loop f4a7fedb47bfc03d7630eba6d708704d2d12517a and Goal da4b1c1745e4fa76cf38f982c9582adf880fc7eb.
          Pinned real-host baseline: OpenCode 2.0.18, not a claim about every future V2 release.

          ## Goal

          Port behavior, not just package names. V2 execution must use native prompt,
          command, tool, event and compaction boundaries. Keep the explicit V1 adapter
          isolated and tested while it remains supported; it must not initialize on V2.
          Preserve project-local state, budgets, evidence and single-owner execution.

          ## Work plan and exit gates

          | Phase | Work | Exit gate | Status |
          | --- | --- | --- | --- |
          | 0 | Inventory both main branches, public entries and official V2 APIs | Reproducible baseline and known gaps recorded | Started; full feature matrix remains open |
          | 1 | Native plugin lifetime, reload and admission races | Negative regression first, then passing native and complete suites | Loop lifetime increment verified by the creating workflow |
          | 2 | Every command/option, scheduler, daemon and installer | Explicit native support or actionable rejection for each surface | Pending |
          | 3 | Goal completion, recovery, per-unit handoff and Loop coexistence | No second owner; budgets/evidence preserved across boundaries | Existing tests retained; expanded joint matrix pending |
          | 4 | V2 options, diagnostics, tool progress and user-facing docs | Configuration and diagnostics match actual capabilities | Pending |
          | 5 | Batch Windows/Linux, installed-package and real-host validation | Exact final heads green; publish separately with registry proof | Pending |

          ## First Loop increment

          - Native local and package entries now share the canonical plugin ID.
          - The actual event subscription receives an AbortSignal. Cleanup aborts it
            before waiting for an async iterator with an outstanding next() call.
          - Concurrent cleanup calls share one promise. A failed registration cleanup
            does not prevent the remaining registrations from being released.
          - Late events and expected stream cancellation cannot restart Loop work.
          - New regressions are part of npm test; entry isolation is also checked on
            the installed production tarball. No model/session abort was introduced.

          The creating workflow reproduced the original idle-unload assertion failure
          before editing source, then rebuilt bundles and ran check, test and package smoke.
          This increment is not a claim that the full V1/V2 feature matrix is complete.

          ## Remaining Loop audit

          Audit every legacy command and option against the native implementation,
          including daemon execution, session/worktree scoping, failure/retry behavior,
          stop files, watch mode, verification/checkpoints and scheduled compaction.
          Never infer completion or permission from message text. Missing native
          capability must be visible, not silently emulated with a legacy call.

          ## Joint constraints

          Goal owns its unfinished sessions; Loop cannot supply a second continuation.
          Goal handoff states and verification evidence remain authoritative. Do not
          rewrite old session histories to hide compaction errors. Keep unrelated
          issues open; a green test run is not proof that npm has been published.

          ## References

          - https://opencode.ai/v2/docs/build/plugins/migrate-v1
          - https://opencode.ai/v2/docs/build/plugins/
          - https://github.com/ByBrawe/opencode-goal/blob/main/docs/opencode2-migration-plan.md
          PLAN
      - name: Commit verified files only to unchanged main and retire this pass
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          EXPECTED=$(git rev-parse HEAD)
          CURRENT=$(git ls-remote origin refs/heads/main | cut -f1)
          test "$EXPECTED" = "$CURRENT"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/source/opencode2/native-plugin.js src/index.js src/server.js src/native.js scripts/native-entry-test.mjs scripts/native-plugin-lifetime-test.mjs package.json docs/opencode2-migration-plan.md
          git rm -- .github/workflows/v2-lifetime-pass.yml
          git diff --cached --check
          git commit -m 'fix: bind native Loop identity and cleanup to the V2 plugin lifetime'
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' push origin HEAD:refs/heads/main
          echo "Verified Loop increment: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
