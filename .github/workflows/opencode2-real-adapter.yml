name: OpenCode 2 Real Adapter

on:
  pull_request:
    paths:
      - "src/source/opencode2/**"
      - "src/source/server.js"
      - "src/server.js"
      - "scripts/install-node.mjs"
      - "package.json"
      - "scripts/fixtures/opencode2-real-adapter-probe.js"
      - "scripts/opencode2-loop-canary.mjs"
      - ".github/workflows/opencode2-real-adapter.yml"
  push:
    branches: [main]
    paths:
      - "src/source/opencode2/**"
      - "src/source/server.js"
      - "src/server.js"
      - "scripts/install-node.mjs"
      - "package.json"
      - "scripts/fixtures/opencode2-real-adapter-probe.js"
      - "scripts/opencode2-loop-canary.mjs"
      - ".github/workflows/opencode2-real-adapter.yml"

permissions:
  contents: read

jobs:
  adapter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - name: Isolate OpenCode 2 paths
        shell: bash
        run: |
          echo "HOME=$RUNNER_TEMP/opencode2-home" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/opencode2-home/.config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/opencode2-home/.local/share" >> "$GITHUB_ENV"
          echo "XDG_STATE_HOME=$RUNNER_TEMP/opencode2-home/.local/state" >> "$GITHUB_ENV"
      - run: npm ci
      - name: Install exact OpenCode 2.0.11 runtime
        run: npm install -g @opencode/cli@2.0.11
      - name: Show adapter host version
        run: opencode --version
      - name: Prepare adapter project
        shell: bash
        run: |
          project="$RUNNER_TEMP/opencode-loop-v2-real-adapter"
          plugin_dir="$XDG_CONFIG_HOME/opencode/plugins"
          mkdir -p "$plugin_dir" "$project" "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME"
          cp "$GITHUB_WORKSPACE/scripts/fixtures/opencode2-real-adapter-probe.js" "$plugin_dir/opencode-loop-v2-real.js"
          touch "$project/.gitkeep"
          git init --quiet "$project"
          git -C "$project" config user.email "opencode-loop-ci@example.invalid"
          git -C "$project" config user.name "OpenCode Loop CI"
          git -C "$project" add .
          git -C "$project" commit --quiet -m "init"
          plugin_url="$(node --input-type=module -e 'import { pathToFileURL } from "node:url"; console.log(pathToFileURL(process.argv[1]).href)' "$GITHUB_WORKSPACE/src/source/opencode2/experimental.js")"
          echo "OPENCODE_LOOP_V2_PLUGIN_URL=$plugin_url" >> "$GITHUB_ENV"
          echo "OPENCODE_LOOP_V2_MARKER=$project/v2-real-adapter-marker.json" >> "$GITHUB_ENV"
          echo "OPENCODE_LOOP_V2_PROJECT=$project" >> "$GITHUB_ENV"
      - name: Activate real adapter on 2.0.11
        shell: bash
        env:
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
          OPENCODE_PRINT_LOGS: "1"
        run: |
          rm -f "$OPENCODE_LOOP_V2_MARKER"
          ready=0
          for attempt in $(seq 1 80); do
            opencode api get /api/command -H "x-opencode-directory: $OPENCODE_LOOP_V2_PROJECT" > "$RUNNER_TEMP/opencode2-real-command.json" 2>"$RUNNER_TEMP/opencode2-real-command.err" || true
            if node -e 'const fs=require("node:fs"); let value; try { value=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); } catch { process.exit(1) }; const data=Array.isArray(value?.data)?value.data:Array.isArray(value)?value:[]; const names=new Set(data.map((item)=>item?.name)); const required=["loop","loop-status","loop-now","loop-export","loop-help","loop-doctor","loop-logs"]; process.exit(required.every((name)=>names.has(name))?0:1)' "$RUNNER_TEMP/opencode2-real-command.json"; then
              ready=1
              break
            fi
            sleep 0.2
          done
          cat "$RUNNER_TEMP/opencode2-real-command.json" || true
          cat "$RUNNER_TEMP/opencode2-real-command.err" >&2 || true
          test "$ready" = "1"

          # The marker is a probe-side diagnostic only. Validate it when the
          # host happened to flush it, but do not make a filesystem side effect
          # stronger evidence than the real command registry + E2E canary.
          if [ -f "$OPENCODE_LOOP_V2_MARKER" ]; then
            cat "$OPENCODE_LOOP_V2_MARKER"
            node -e 'const fs=require("node:fs"); const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(value.id!=="bybrawe.opencode-loop.v2.experimental" || value.activated!==true || value.commandTransform!==true || value.eventSubscribe!==true || value.sessionPrompt!==true || value.sessionCommand!==true) process.exit(1)' "$OPENCODE_LOOP_V2_MARKER"
          fi
      # Keep the multi-turn host gate separate from the capability probe above.
      - name: Run real two-turn V2 Loop canary on 2.0.11
        run: node scripts/opencode2-loop-canary.mjs
        env:
          OPENCODE2_BINARY: opencode
          OPENCODE2_CURRENT_COMMAND_FIELDS: "1"

  exact-2-0-11-loader:
    name: OpenCode 2.0.11 local plugin contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - name: Build dual local plugin bundle
        run: npm run build:plugin
      - name: Install exact OpenCode 2.0.11 CLI
        run: npm install -g @opencode/cli@2.0.11
      - name: Show exact OpenCode version
        run: opencode --version
      - name: Prepare exact 2.0.11 local plugin project
        shell: bash
        run: |
          project="$GITHUB_WORKSPACE/.tmp-opencode-2-0-11"
          rm -rf "$project"
          mkdir -p "$project" "$project/.home/.config/opencode/plugins" "$project/.home/.local/share" "$project/.home/.local/state"
          cp "$GITHUB_WORKSPACE/src/server.js" "$project/.home/.config/opencode/plugins/opencode-loop.ts"
          git init --quiet "$project"
          git -C "$project" config user.email "opencode-loop-ci@example.invalid"
          git -C "$project" config user.name "OpenCode Loop CI"
          git -C "$project" add .
          git -C "$project" commit --quiet -m "init"
          echo "OPENCODE_LOOP_EXACT_PROJECT=$project" >> "$GITHUB_ENV"
          echo "HOME=$project/.home" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$project/.home/.config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$project/.home/.local/share" >> "$GITHUB_ENV"
          echo "XDG_STATE_HOME=$project/.home/.local/state" >> "$GITHUB_ENV"
      - name: Require the dual local plugin and Loop commands on 2.0.11
        shell: bash
        env:
          OPENCODE_DISABLE_AUTOUPDATE: "true"
          OPENCODE_DISABLE_LSP_DOWNLOAD: "true"
          OPENCODE_PRINT_LOGS: "1"
        run: |
          cd "$OPENCODE_LOOP_EXACT_PROJECT"
          commands="$RUNNER_TEMP/opencode-2-0-11-commands.json"
          plugins="$RUNNER_TEMP/opencode-2-0-11-plugins.json"
          ready=0
          for attempt in $(seq 1 60); do
            opencode api get /api/command > "$commands" 2>"$RUNNER_TEMP/opencode-2-0-11-command.err" || true
            if node -e '
              const fs=require("node:fs");
              let value; try { value=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); } catch { process.exit(1) }
              const data=Array.isArray(value?.data)?value.data:Array.isArray(value)?value:[];
              const names=new Set(data.map((item)=>item?.name));
              const required=["loop","loop-status","loop-now","loop-pause","loop-resume","loop-stop","loop-help","loop-doctor"];
              if(required.every((name)=>names.has(name))) process.exit(0);
              process.exit(1);
            ' "$commands"; then
              ready=1
              break
            fi
            sleep 0.2
          done
          cat "$commands" || true
          cat "$RUNNER_TEMP/opencode-2-0-11-command.err" >&2 || true
          opencode api get /api/plugin > "$plugins" 2>"$RUNNER_TEMP/opencode-2-0-11-plugin.err" || true
          cat "$plugins" || true
          cat "$RUNNER_TEMP/opencode-2-0-11-plugin.err" >&2 || true
          test "$ready" = "1"
          node -e '
            const fs=require("node:fs");
            const value=JSON.parse(fs.readFileSync(process.argv[1],"utf8"));
            const data=Array.isArray(value?.data)?value.data:Array.isArray(value)?value:[];
            const plugin=data.find((item)=>item?.id==="@bybrawe/opencode-loop" || String(item?.source?.path||"").includes("opencode-loop.ts"));
            if(!plugin) throw new Error("Loop local plugin missing from OpenCode 2.0.11 inventory after command activation");
            if(plugin?.state?.status!=="active") throw new Error("Loop local plugin is not active: "+JSON.stringify(plugin));
          ' "$plugins"
