name: V2 Heartbeat Contract

on:
  pull_request:
    paths:
      - "src/source/runtime/heartbeat.js"
      - ".github/workflows/v2-heartbeat-contract.yml"
  push:
    branches:
      - v2-runtime-supervisor

permissions:
  contents: read

jobs:
  heartbeat:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: node --check src/source/runtime/heartbeat.js
      - name: Exercise one heartbeat cycle
        run: node --input-type=module -e "import { createRuntimeHeartbeat } from './src/source/runtime/heartbeat.js'; import { createSessionRuntimeManager } from './src/source/runtime/session-manager.js'; let now=0; const manager=createSessionRuntimeManager({now:()=>now,staleAfterMs:10}); manager.observeExternal('ses_contract'); let visits=0; const heartbeat=createRuntimeHeartbeat({manager,onSession:async()=>{visits++}}); const first=await heartbeat.tick(now); if(first.visited!==1||visits!==1) throw new Error('heartbeat did not visit session'); now=11; const second=await heartbeat.tick(now); if(second.removed[0]!=='ses_contract'||second.visited!==0) throw new Error('heartbeat did not prune stale session'); heartbeat.dispose('contract'); manager.dispose();"
