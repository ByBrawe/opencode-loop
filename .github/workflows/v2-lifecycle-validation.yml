name: V2 lifecycle candidate

on:
  push:
    paths: ['.github/workflows/v2-lifecycle-validation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - name: Load immutable candidate recipe
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs'
          const r = await fetch('https://api.github.com/repos/ByBrawe/opencode-loop/git/blobs/7299e9551e73593dfdf5357a43df656576f7f26e', { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}` } })
          if (!r.ok) throw new Error(`recipe HTTP ${r.status}`)
          const blob = await r.json()
          writeFileSync(`${process.env.RUNNER_TEMP}/v2-candidate.py`, Buffer.from(blob.content, 'base64'))
          JS
      - name: Reproduce regressions before applying the correction
        shell: bash
        run: |
          python "$RUNNER_TEMP/v2-candidate.py" tests
          node --check scripts/native-cli-io-test.mjs
          node --check scripts/native-lifecycle-test.mjs
          if node --test scripts/native-cli-io-test.mjs scripts/native-lifecycle-test.mjs > "$RUNNER_TEMP/baseline.log" 2>&1; then
            cat "$RUNNER_TEMP/baseline.log"
            echo 'Regression unexpectedly passed on the original source'
            exit 1
          fi
          cat "$RUNNER_TEMP/baseline.log"
          grep -q 'native CLI binds PWD' "$RUNNER_TEMP/baseline.log"
          grep -q 'native CLI receives EOF' "$RUNNER_TEMP/baseline.log"
          grep -q 'native unload aborts a pending' "$RUNNER_TEMP/baseline.log"
          python "$RUNNER_TEMP/v2-candidate.py" fix
      - name: Build and validate corrected source
        shell: bash
        run: |
          npm run build:plugin
          npm run check
          npm test
          npm run package:smoke
          git diff --check
      - uses: actions/checkout@v6
        if: matrix.os == 'ubuntu-latest'
        with:
          repository: ByBrawe/opencode-goal
          ref: 612612d01e1dd71c19994fe27ef03be58a38f7bf
          path: companion-goal
          persist-credentials: false
      - name: Exact real-host and joint-installer validation
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          (cd companion-goal && npm install && npm run build)
          export OPENCODE_GOAL_INSTALLER="$GITHUB_WORKSPACE/companion-goal/dist/install.js"
          node scripts/native-install-pair-test.mjs
          npm install --prefix "$RUNNER_TEMP/native-host" --package-lock=false @opencode/cli@2.0.18
          export OPENCODE2_BINARY="$RUNNER_TEMP/native-host/node_modules/.bin/opencode2"
          export OPENCODE2_CURRENT_COMMAND_FIELDS=1
          export OPENCODE2_NATIVE_REQUIRED=1
          export OPENCODE_GOAL_V2_PLUGIN_URL="file://$GITHUB_WORKSPACE/companion-goal/dist/server.js"
          node scripts/opencode2-loop-canary.mjs
          node scripts/native-cli-host-canary.mjs
      - name: Store verified source blobs without updating any branch
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const paths = ['scripts/loopd.mjs', 'scripts/native-cli-io-test.mjs', 'scripts/native-lifecycle-test.mjs', 'src/source/opencode2/native-plugin.js', 'src/source/opencode2/event-bridge.js', 'src/index.js', 'src/server.js', 'src/native.js', 'package.json', 'docs/OPENCODE2-INSTALLATION.md', 'docs/OPENCODE2-MIGRATION.md']
          for (const path of paths) {
            const data = readFileSync(path)
            const expected = createHash('sha1').update(`blob ${data.length}\0`).update(data).digest('hex')
            const r = await fetch('https://api.github.com/repos/ByBrawe/opencode-loop/git/blobs', { method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ content: data.toString('base64'), encoding: 'base64' }) })
            if (!r.ok) throw new Error(`blob HTTP ${r.status}`)
            const blob = await r.json()
            if (blob.sha !== expected) throw new Error('verified source digest mismatch')
            console.log(`VERIFIED_FILE ${path} ${blob.sha}`)
          }
          console.log('No branch or commit was modified by this job.')
          JS
