name: Commit Session Activity Refactor
on:
  push:
    branches: [refactor-session-activity-20260814]
    paths: [.github/workflows/commit-session-activity-refactor.yml]
permissions:
  contents: write
jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor-session-activity-20260814
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: node scripts/refactor-session-activity.mjs
      - run: node --check src/source/runtime/session-activity.js
      - run: npm run build:plugin
      - run: npm run check
      - run: npm test
      - uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs')
            for (const path of ['src/source/runtime/session-activity.js','src/source/legacy-v1.js','src/index.js']) {
              let sha
              try { sha = (await github.rest.repos.getContent({owner:context.repo.owner,repo:context.repo.repo,path,ref:'refactor-session-activity-20260814'})).data.sha } catch (e) { if (e.status !== 404) throw e }
              await github.rest.repos.createOrUpdateFileContents({owner:context.repo.owner,repo:context.repo.repo,path,branch:'refactor-session-activity-20260814',message:'refactor: extract session activity runtime',content:fs.readFileSync(path).toString('base64'),...(sha?{sha}:{})})
            }
