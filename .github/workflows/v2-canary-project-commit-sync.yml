name: One-shot V2 canary project fixture sync

on:
  push:
    branches:
      - test/v2-real-loop-canary-current
    paths:
      - ".github/workflows/v2-canary-project-commit-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/v2-real-loop-canary-current
      - name: Patch fixture and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/opencode2-loop-canary.mjs')
          text = path.read_text()
          old = '  execFileSync("git", ["init", "--quiet", workspace], { stdio: "ignore" })\n'
          new = old + '''  execFileSync("git", ["-C", workspace, "config", "user.email", "opencode-loop-ci@example.invalid"], { stdio: "ignore" })
          execFileSync("git", ["-C", workspace, "config", "user.name", "OpenCode Loop CI"], { stdio: "ignore" })
          execFileSync("git", ["-C", workspace, "add", "."], { stdio: "ignore" })
          execFileSync("git", ["-C", workspace, "commit", "--quiet", "-m", "init"], { stdio: "ignore" })
          '''
          if old not in text:
              raise SystemExit('target git init line not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/v2-canary-project-commit-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/opencode2-loop-canary.mjs
          git commit -m "test: commit V2 canary fixture project"
          git push origin HEAD:test/v2-real-loop-canary-current
