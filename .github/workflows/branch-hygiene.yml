name: Branch Hygiene

on:
  pull_request:
    paths:
      - "scripts/branch-hygiene.mjs"
      - ".github/workflows/branch-hygiene.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: branch-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate cleanup planner in dry-run mode
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_HYGIENE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH_HYGIENE_ARCHIVE_REF: archive/legacy-branches-2026-09-21
          BRANCH_HYGIENE_DRY_RUN: "1"
        run: node scripts/branch-hygiene.mjs

  cleanup:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Delete exact merged-head branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_HYGIENE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH_HYGIENE_ARCHIVE_REF: archive/legacy-branches-2026-09-21
        run: node scripts/branch-hygiene.mjs
