name: Branch Hygiene

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: branch-hygiene
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Delete exact merged-head branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_HYGIENE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/branch-hygiene.mjs
