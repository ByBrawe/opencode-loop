name: Branch Hygiene

on:
  pull_request:
    paths:
      - "scripts/branch-hygiene.mjs"
      - ".github/workflows/branch-hygiene.yml"
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: branch-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Validate cleanup planner in dry-run mode
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_HYGIENE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BRANCH_HYGIENE_DRY_RUN: "1"
        run: node scripts/branch-hygiene.mjs

  cleanup:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Delete exact merged-head branches
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BRANCH_HYGIENE_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node scripts/branch-hygiene.mjs
      - name: Remove the two explicitly consolidated branches without losing history
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          main_sha="$(git rev-parse refs/remotes/origin/main)"
          leases=()
          deletions=()
          while read -r branch expected; do
            actual="$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)"
            if [ -z "$actual" ]; then
              echo "Already removed: $branch"
              continue
            fi
            if [ "$actual" != "$expected" ]; then
              echo "Refusing to delete changed branch: $branch" >&2
              exit 1
            fi
            git merge-base --is-ancestor "$actual" "$main_sha"
            leases+=("--force-with-lease=refs/heads/$branch:$expected")
            deletions+=(":refs/heads/$branch")
          done <<'BRANCHES'
          fix/opencode2-native-compaction-164 e5e140f5fcfd42c79b02169bc748ef72b7b2610d
          archive/legacy-branches-2026-09-21 3648323ec20527d4dbfbe4cc4c0a1d0cbb2a19f2
          BRANCHES
          if [ "${#deletions[@]}" -gt 0 ]; then
            git push --atomic "${leases[@]}" origin "${deletions[@]}"
          fi
          {
            echo '## Consolidated branch history'
            echo 'Both recorded branch tips are retained as ancestors of main.'
            echo 'Deletion uses exact SHA leases; concurrent changes are never discarded.'
            echo '```'
            git ls-remote --heads origin
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
