name: One-shot network recovery bundle sync

on:
  push:
    branches:
      - fix/network-recovery-terminal-guard
    paths:
      - .github/workflows/sync-network-bundle.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/network-recovery-terminal-guard
          fetch-depth: 0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: "24"
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: latest
      - run: npm ci
      - name: Build stable single-file entry from modular source
        run: npm run build:plugin
      - name: Require bundle-only generated diff
        shell: bash
        run: |
          CHANGED="$(git status --short)"
          echo "$CHANGED"
          EXTRA="$(git status --short | awk '{print $2}' | grep -v '^src/index.js$' || true)"
          if [[ -n "$EXTRA" ]]; then
            echo "Unexpected generated changes:" >&2
            echo "$EXTRA" >&2
            exit 1
          fi
          if git diff --quiet -- src/index.js; then
            echo "Stable bundle already matches modular source."
            exit 0
          fi
          git add src/index.js
          git config user.name "OpenCode Loop CI"
          git config user.email "opencode-loop-ci@example.invalid"
          git commit -m "build: sync network recovery stable bundle"
          git push origin HEAD:fix/network-recovery-terminal-guard
