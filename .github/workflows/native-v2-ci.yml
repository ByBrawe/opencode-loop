name: Native V2 CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/native-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-regressions:
    name: native bundles and regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - run: npm run build:plugin
      - name: Verify all committed bundles match source
        run: git diff --exit-code -- src/index.js src/server.js src/native.js
      - run: npm run check
      - run: npm test
      - run: npm run package:smoke
      - name: Verify standalone native bundle has no V1 SDK import
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import assert from 'node:assert/strict'
          const source = readFileSync('src/native.js', 'utf8')
          assert.doesNotMatch(source, /from\s+["']@opencode-ai\/plugin/, 'native bundle imports V1 SDK')
          const { default: plugin } = await import('./src/native.js')
          assert.equal(plugin.id, '@bybrawe/opencode-loop')
          assert.equal(typeof plugin.setup, 'function')
          console.log('Canonical native entry loads independently of V1 SDK imports')
          JS

  latest-native-loop:
    name: Latest OpenCode 2 with standalone Loop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - run: npm run build:plugin
      - name: Install current OpenCode 2 without a Goal package
        shell: bash
        run: |
          host="$RUNNER_TEMP/opencode2-latest"
          npm install --prefix "$host" --package-lock=false @opencode/cli@latest
          bin="$host/node_modules/.bin/opencode2"
          if [ ! -x "$bin" ]; then bin="$host/node_modules/.bin/opencode"; fi
          test -x "$bin"
          echo "OPENCODE2_BINARY=$bin" >> "$GITHUB_ENV"
          node -e 'console.log("OpenCode CLI", require(process.argv[1]).version)' "$host/node_modules/@opencode/cli/package.json"
          "$bin" --version
      - name: Real latest V2 host with standalone Loop
        env:
          OPENCODE2_CURRENT_COMMAND_FIELDS: '1'
          OPENCODE2_NATIVE_REQUIRED: '1'
          OPENCODE2_NATIVE_COMPACT_CANARY: '1'
        run: node scripts/opencode2-loop-canary.mjs

  pinned-native-loop:
    name: OpenCode 2.0.18 standalone Loop
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci
      - name: Install exact OpenCode host without Goal
        run: npm install --prefix /tmp/native-host --package-lock=false @opencode/cli@2.0.18
      - name: Real host with Loop-only native plugin
        env:
          OPENCODE2_BINARY: /tmp/native-host/node_modules/.bin/opencode2
          OPENCODE2_CURRENT_COMMAND_FIELDS: '1'
          OPENCODE2_NATIVE_REQUIRED: '1'
        run: |
          test "$("$OPENCODE2_BINARY" --version)" = 'opencode v2.0.18'
          node scripts/opencode2-loop-canary.mjs
      - name: Real native CLI daemon keeps two turns in one session
        env:
          OPENCODE2_BINARY: /tmp/native-host/node_modules/.bin/opencode2
        run: node scripts/native-cli-host-canary.mjs

  pinned-v2-1-4-native-loop:
    name: OpenCode 2.1.4 standalone Loop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - run: npm run build:plugin
      - name: Ensure source and native bundles match
        run: git diff --exit-code -- src/index.js src/server.js src/native.js
      - name: Install exact 2.1.4 OpenCode host without Goal
        shell: bash
        run: |
          host="$RUNNER_TEMP/opencode2-2.1.4"
          npm install --prefix "$host" --package-lock=false @opencode/cli@2.1.4
          bin="$host/node_modules/.bin/opencode2"
          if [ ! -x "$bin" ]; then bin="$host/node_modules/.bin/opencode"; fi
          test -x "$bin"
          echo "OPENCODE2_BINARY=$bin" >> "$GITHUB_ENV"
          test "$("$bin" --version)" = 'opencode v2.1.4'
      - name: Real OpenCode 2.1.4 native Loop and compaction lifecycle
        env:
          OPENCODE2_NATIVE_REQUIRED: '1'
          OPENCODE2_MACOS_NATIVE_CANARY: '1'
          OPENCODE2_CURRENT_COMMAND_FIELDS: '1'
          OPENCODE2_NATIVE_COMPACT_CANARY: '1'
        run: node scripts/opencode2-loop-canary.mjs
