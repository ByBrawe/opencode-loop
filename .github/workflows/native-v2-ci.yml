name: Native V2 CI

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'package*.json'
      - '.github/workflows/native-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-v2-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-regressions:
    name: native bundles and regressions (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - run: npm run build:plugin
      - name: Verify all committed bundles match source
        run: git diff --exit-code -- src/index.js src/server.js src/native.js
      - run: npm run check
      - run: npm test
      - run: npm run package:smoke
      - name: Verify standalone native identity and V1 isolation
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import assert from 'node:assert/strict'
          const source = readFileSync('src/native.js', 'utf8')
          assert.doesNotMatch(source, /from\s+["']@opencode-ai\/plugin/, 'native bundle imports V1 SDK')
          const { default: plugin } = await import('./src/native.js')
          assert.equal(plugin.id, '@bybrawe/opencode-loop')
          assert.equal(typeof plugin.setup, 'function')
          console.log('Canonical native entry loads independently of V1 SDK imports')
          JS

  real-native-pair:
    name: OpenCode 2.0.18 with Loop and Goal
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - run: npm ci
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ByBrawe/opencode-goal
          ref: 2d5bff13009cde9d83d91b560b44502beef0db84
          path: companion-goal
          persist-credentials: false
      - name: Build exact Goal companion
        working-directory: companion-goal
        run: npm install && npm run build
      - name: Verify native joint installer without network package resolution
        env:
          OPENCODE_GOAL_INSTALLER: ${{ github.workspace }}/companion-goal/dist/install.js
        run: node scripts/native-install-pair-test.mjs
      - name: Install exact OpenCode host
        run: npm install --prefix /tmp/native-host --package-lock=false @opencode/cli@2.0.18
      - name: Real host with both shipped plugin entries
        env:
          OPENCODE2_BINARY: /tmp/native-host/node_modules/.bin/opencode2
          OPENCODE2_CURRENT_COMMAND_FIELDS: '1'
          OPENCODE2_NATIVE_REQUIRED: '1'
        run: |
          test "$("$OPENCODE2_BINARY" --version)" = 'opencode v2.0.18'
          export OPENCODE_GOAL_V2_PLUGIN_URL="file://$GITHUB_WORKSPACE/companion-goal/dist/server.js"
          node scripts/opencode2-loop-canary.mjs
      - name: Real native CLI daemon keeps two turns in one session
        env:
          OPENCODE2_BINARY: /tmp/native-host/node_modules/.bin/opencode2
        run: node scripts/native-cli-host-canary.mjs
