name: Experimental OpenCode 2 Sentinel

on:
  push:
    branches:
      - experimental-opencode2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install stable Loop dependencies
        run: npm ci

      - name: Verify stable Loop before V2 probe
        run: |
          npm run check
          node scripts/comprehensive-watchdog.mjs

      - name: Install current OpenCode 2 beta
        run: npm install --global @opencode-ai/cli@next

      - name: Show OpenCode 2 version
        run: opencode2 --version

      - name: Run stable Loop real-host canary on OpenCode 2
        shell: bash
        env:
          OPENCODE_HOST_API_MODE: "v2"
        run: |
          v2="$(command -v opencode2)"
          test -n "$v2"
          rm -f "$GITHUB_WORKSPACE/node_modules/.bin/opencode"
          ln -s "$v2" "$GITHUB_WORKSPACE/node_modules/.bin/opencode"
          perl -0pi -e 's/path\.join\(env\.XDG_DATA_HOME, "opencode", "password"\)/path.join(home, ".local", "state", "opencode", "password")/' scripts/host-loop-canary.mjs
          node scripts/host-loop-canary.mjs

      - name: Install current V2 plugin SDK for native probe
        run: npm install --no-save --package-lock=false @opencode-ai/plugin@next

      - name: Verify experimental adapters syntax
        run: |
          node --check src/source/opencode2/experimental.js
          node --check src/source/opencode2/compat-v1-sentinel.js

      - name: Probe native V2 plugin registry (informational)
        continue-on-error: true
        shell: bash
        run: |
          project="$RUNNER_TEMP/opencode2-loop-sentinel"
          mkdir -p "$project/.opencode/plugins"
          git init -q "$project"
          cp "$GITHUB_WORKSPACE/src/source/opencode2/experimental.js" "$project/.opencode/plugins/opencode-loop-v2.js"
          cp "$GITHUB_WORKSPACE/src/source/opencode2/compat-v1-sentinel.js" "$project/.opencode/plugins/v1-compat-sentinel.js"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$project/node_modules"
          opencode2 service stop >/dev/null 2>&1 || true
          request="$(node -e 'const d=encodeURIComponent(process.argv[1]); console.log(`/api/plugin?directory=${d}&location%5Bdirectory%5D=${d}`)' "$project")"
          output="$(opencode2 api get "$request")"
          printf '%s\n' "$output"

      - name: Show server log on failure
        if: failure()
        shell: bash
        run: |
          log="$HOME/.local/share/opencode/log/opencode.log"
          if [ -f "$log" ]; then tail -n 240 "$log"; fi
