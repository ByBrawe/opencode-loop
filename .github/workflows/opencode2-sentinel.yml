name: Experimental OpenCode 2 Sentinel

on:
  push:
    branches:
      - experimental-opencode2
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install stable dependencies
        run: npm ci

      - name: Replace plugin package with current V2 beta
        run: npm install --no-save --package-lock=false @opencode-ai/plugin@next

      - name: Verify experimental adapter syntax
        run: |
          node --check src/source/opencode2/experimental.js
          node --check src/source/opencode2/compat-v1-sentinel.js

      - name: Install current OpenCode 2 beta
        run: npm install --global @opencode-ai/cli@next

      - name: Show OpenCode 2 version
        run: opencode2 --version

      - name: Prepare isolated V2 project
        shell: bash
        run: |
          project="$RUNNER_TEMP/opencode2-loop-sentinel"
          mkdir -p "$project/.opencode/plugins"
          git init -q "$project"
          cp "$GITHUB_WORKSPACE/src/source/opencode2/experimental.js" "$project/.opencode/plugins/opencode-loop-v2.js"
          cp "$GITHUB_WORKSPACE/src/source/opencode2/compat-v1-sentinel.js" "$project/.opencode/plugins/v1-compat-sentinel.js"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$project/node_modules"
          echo "OPENCODE2_SENTINEL_PROJECT=$project" >> "$GITHUB_ENV"

      - name: Probe plugin activation in real OpenCode 2 host
        shell: bash
        run: |
          cd "$OPENCODE2_SENTINEL_PROJECT"
          opencode2 service stop >/dev/null 2>&1 || true
          request="$(node -e 'const d=encodeURIComponent(process.argv[1]); console.log(`/api/plugin?directory=${d}&location%5Bdirectory%5D=${d}`)' "$OPENCODE2_SENTINEL_PROJECT")"
          output="$(opencode2 api get "$request")"
          printf '%s\n' "$output"
          OUTPUT="$output" node -e 'const value=JSON.parse(process.env.OUTPUT); if (!Array.isArray(value.data) || value.data.length < 1) { console.error("No external plugin activated"); process.exit(1) }'
          if printf '%s\n' "$output" | grep -Fq 'bybrawe.opencode-loop.v2'; then
            echo "Native V2 plugin API is active."
          else
            echo "V1 compatibility plugin activated; native V2 plugin API is not active yet."
          fi

      - name: Show server log on failure
        if: failure()
        shell: bash
        run: |
          log="$HOME/.local/share/opencode/log/opencode.log"
          if [ -f "$log" ]; then tail -n 220 "$log"; fi
