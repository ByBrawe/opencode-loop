name: OpenCode 2 Activation

on:
  pull_request:
    paths:
      - "src/source/opencode2/**"
      - ".github/workflows/opencode2-activation.yml"
  push:
    branches:
      - main
    paths:
      - "src/source/opencode2/**"
      - ".github/workflows/opencode2-activation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Initialize isolated OpenCode 2 paths
        shell: bash
        run: |
          echo "HOME=$RUNNER_TEMP/opencode2-home" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/opencode2-home/.config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/opencode2-home/.local/share" >> "$GITHUB_ENV"
          echo "XDG_STATE_HOME=$RUNNER_TEMP/opencode2-home/.local/state" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Install matching OpenCode 2 beta packages
        run: npm install --no-save --package-lock=false @opencode-ai/cli@next @opencode-ai/plugin@next

      - name: Show tested V2 versions
        shell: bash
        run: |
          node -p "require('./node_modules/@opencode-ai/plugin/package.json').version"
          "$GITHUB_WORKSPACE/node_modules/.bin/opencode2" --version

      - name: Verify sentinel imports with tested V2 package
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          const plugin = await import("./src/source/opencode2/experimental.js")
          if (plugin.default?.id !== "bybrawe.opencode-loop.v2.experimental") {
            throw new Error(`unexpected V2 sentinel id: ${plugin.default?.id}`)
          }
          console.log("V2 sentinel direct import passed")
          NODE

      - name: Prepare isolated V2 project with local plugin discovery
        shell: bash
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME"
          project="$RUNNER_TEMP/opencode-loop-v2-activation"
          mkdir -p "$project/.opencode/plugins"
          git init --quiet "$project"
          git -C "$project" config user.email "opencode-loop-ci@example.invalid"
          git -C "$project" config user.name "OpenCode Loop CI"
          cp "$GITHUB_WORKSPACE/src/source/opencode2/experimental.js" "$project/.opencode/plugins/opencode-loop-v2.js"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$project/node_modules"
          git -C "$project" add .opencode/plugins/opencode-loop-v2.js
          git -C "$project" commit --quiet -m "init"
          git -C "$project" rev-parse --show-toplevel
          find "$project/.opencode" -maxdepth 3 -type f -print

      - name: Verify plugin is active in real OpenCode 2 host
        shell: bash
        run: |
          cd "$RUNNER_TEMP/opencode-loop-v2-activation"
          plugins="$("$GITHUB_WORKSPACE/node_modules/.bin/opencode2" plugin list)"
          printf '%s\n' "$plugins"
          printf '%s\n' "$plugins" | grep -F "bybrawe.opencode-loop.v2.experimental"

      - name: Dump OpenCode 2 logs on failure
        if: failure()
        shell: bash
        run: |
          find "$XDG_DATA_HOME" -maxdepth 6 -type f -print -exec sh -c 'echo "--- $1"; tail -n 200 "$1"' _ {} \;
