name: OpenCode 2 Activation

on:
  pull_request:
    paths:
      - "src/source/opencode2/**"
      - "src/source/runtime/**"
      - ".github/workflows/opencode2-activation.yml"
  push:
    branches:
      - main
    paths:
      - "src/source/opencode2/**"
      - "src/source/runtime/**"
      - ".github/workflows/opencode2-activation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  activation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Initialize isolated OpenCode 2 paths
        shell: bash
        run: |
          echo "HOME=$RUNNER_TEMP/opencode2-home" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/opencode2-home/.config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/opencode2-home/.local/share" >> "$GITHUB_ENV"
          echo "XDG_STATE_HOME=$RUNNER_TEMP/opencode2-home/.local/state" >> "$GITHUB_ENV"

      - run: npm ci

      - name: Install OpenCode 2 CLI with postinstall enabled
        run: npm install -g --allow-scripts=@opencode-ai/cli @opencode-ai/cli@next

      - name: Install matching OpenCode 2 plugin API
        run: npm install --no-save --package-lock=false @opencode-ai/plugin@next

      - name: Show tested V2 versions and package layout
        shell: bash
        run: |
          node -p "require('./node_modules/@opencode-ai/plugin/package.json').version"
          command -v opencode2
          opencode2 --version
          node -p "JSON.stringify(require('./node_modules/@opencode-ai/plugin/package.json').exports, null, 2)"

      - name: Prepare V2 activation probes
        shell: bash
        run: |
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME"
          project="$RUNNER_TEMP/opencode-loop-v2-activation"
          plugin_dir="$project/.opencode/plugins"
          mkdir -p "$plugin_dir"
          git init --quiet "$project"
          git -C "$project" config user.email "opencode-loop-ci@example.invalid"
          git -C "$project" config user.name "OpenCode Loop CI"

          cat > "$plugin_dir/opencode-loop-v2-probe.js" <<'EOF'
          import { writeFile } from "node:fs/promises"

          const id = "bybrawe.opencode-loop.v2.activation-probe"
          const marker = new URL("../../v2-activation-marker.json", import.meta.url)
          const keys = (value) => value && typeof value === "object" ? Object.keys(value).sort() : []

          export default {
            id,
            async setup(ctx) {
              await writeFile(marker, JSON.stringify({
                id,
                activated: true,
                keys: {
                  context: keys(ctx),
                  command: keys(ctx?.command),
                  event: keys(ctx?.event),
                  session: keys(ctx?.session),
                  tool: keys(ctx?.tool),
                },
                capabilities: {
                  commandTransform: typeof ctx?.command?.transform === "function",
                  eventSubscribe: typeof ctx?.event?.subscribe === "function",
                  sessionHook: typeof ctx?.session?.hook === "function",
                  sessionPrompt: typeof ctx?.session?.prompt === "function",
                  toolTransform: typeof ctx?.tool?.transform === "function",
                  toolHook: typeof ctx?.tool?.hook === "function",
                },
              }, null, 2), "utf8")
            },
          }
          EOF

          adapter_url=$(node -e 'console.log(require("node:url").pathToFileURL(process.argv[1]).href)' "$GITHUB_WORKSPACE/src/source/opencode2/experimental.js")
          cat > "$plugin_dir/opencode-loop-v2-runtime-probe.js" <<EOF
          import { writeFile } from "node:fs/promises"
          import plugin from "$adapter_url"

          const id = "bybrawe.opencode-loop.v2.runtime-probe"
          const marker = new URL("../../v2-runtime-marker.json", import.meta.url)

          export default {
            id,
            async setup(ctx) {
              const cleanup = await plugin.setup(ctx)
              await writeFile(marker, JSON.stringify({
                id,
                pluginID: plugin.id,
                activated: true,
                cleanup: typeof cleanup === "function",
              }, null, 2), "utf8")
              return cleanup
            },
          }
          EOF

          git -C "$project" add .opencode/plugins
          git -C "$project" commit --quiet -m "init"

      - name: Verify real adapter setup in OpenCode 2 host
        shell: bash
        run: |
          project="$RUNNER_TEMP/opencode-loop-v2-activation"
          host_marker="$project/v2-activation-marker.json"
          runtime_marker="$project/v2-runtime-marker.json"
          rm -f "$host_marker" "$runtime_marker"

          opencode2 api get /api/command -H "x-opencode-directory: $project" > "$RUNNER_TEMP/opencode2-command.json" 2>&1 || true

          for attempt in $(seq 1 50); do
            if [ -f "$host_marker" ] && [ -f "$runtime_marker" ]; then
              cat "$host_marker"
              cat "$runtime_marker"
              node -e '
                const fs = require("node:fs")
                const host = JSON.parse(fs.readFileSync(process.argv[1], "utf8"))
                const runtime = JSON.parse(fs.readFileSync(process.argv[2], "utf8"))
                if (host.id !== "bybrawe.opencode-loop.v2.activation-probe" || host.activated !== true) process.exit(1)
                if (host.capabilities?.eventSubscribe !== true || host.capabilities?.sessionPrompt !== true) process.exit(1)
                if (runtime.pluginID !== "bybrawe.opencode-loop.v2.experimental" || runtime.activated !== true || runtime.cleanup !== true) process.exit(1)
              ' "$host_marker" "$runtime_marker"
              exit 0
            fi
            sleep 0.2
          done

          echo "OpenCode 2 did not complete the real Loop V2 adapter setup." >&2
          echo "--- /api/command ---" >&2
          cat "$RUNNER_TEMP/opencode2-command.json" >&2 || true
          exit 1

      - name: Dump OpenCode 2 logs on failure
        if: failure()
        shell: bash
        run: |
          find "$XDG_DATA_HOME" -maxdepth 6 -type f -print -exec sh -c 'echo "--- $1"; tail -n 200 "$1"' _ {} \;
