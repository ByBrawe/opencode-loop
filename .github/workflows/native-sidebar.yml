name: Native Loop Sidebar

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "src/**"
      - "scripts/**"
      - "package.json"
      - ".github/workflows/native-sidebar.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-sidebar-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  render:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "24"
      # OpenTUI's native FFI renderer is only reachable from Bun, so the slot
      # render smoke cannot run under plain Node.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.2"
      - run: npm ci
      - run: npm run check
      - run: node scripts/tui-status-test.mjs
      - run: npm run test:tui-native