name: V2 control-state evidence validation

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/v2-control-state-candidate.mjs'
      - '.github/workflows/v2-control-state-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'ByBrawe/opencode-loop' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - name: Reproduce false completion before changing the scanner
        shell: bash
        run: |
          node --check .github/scripts/v2-control-state-candidate.mjs
          node .github/scripts/v2-control-state-candidate.mjs tests
          node --check scripts/control-plane-until-test.mjs
          if node --test scripts/control-plane-until-test.mjs > "$RUNNER_TEMP/baseline.log" 2>&1; then
            cat "$RUNNER_TEMP/baseline.log"
            echo 'Original scanner unexpectedly passed'
            exit 1
          fi
          cat "$RUNNER_TEMP/baseline.log"
          grep -q 'not ok.*Goal/Loop control state' "$RUNNER_TEMP/baseline.log"
          grep -q '# fail 5' "$RUNNER_TEMP/baseline.log"
          node .github/scripts/v2-control-state-candidate.mjs fix
      - name: Build and test every shipped Loop entry
        shell: bash
        run: |
          npm run build:plugin
          npm run check > "$RUNNER_TEMP/check.log" 2>&1 || { tail -80 "$RUNNER_TEMP/check.log"; exit 1; }
          npm test > "$RUNNER_TEMP/loop.log" 2>&1 || { tail -150 "$RUNNER_TEMP/loop.log"; exit 1; }
          tail -100 "$RUNNER_TEMP/loop.log"
          npm run package:smoke
          git diff --check
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: ByBrawe/opencode-goal
          ref: 16a276bb219a512d9a7d2a4dd8b6883eb76b9b54
          path: companion-goal
          persist-credentials: false
      - name: Verify the corrected Goal companion
        working-directory: companion-goal
        shell: bash
        run: |
          npm install
          npm run check
          npm test > "$RUNNER_TEMP/goal.log" 2>&1 || { tail -120 "$RUNNER_TEMP/goal.log"; exit 1; }
          tail -15 "$RUNNER_TEMP/goal.log"
          npm run eval
          npm run package:smoke
      - name: Joint installer, real native pair, CLI and handoff
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          export OPENCODE_GOAL_INSTALLER="$GITHUB_WORKSPACE/companion-goal/dist/install.js"
          node scripts/native-install-pair-test.mjs
          npm install --prefix "$RUNNER_TEMP/native-host" --package-lock=false @opencode/cli@2.0.18
          export OPENCODE2_BINARY="$RUNNER_TEMP/native-host/node_modules/.bin/opencode2"
          test "$("$OPENCODE2_BINARY" --version)" = 'opencode v2.0.18'
          export OPENCODE2_CURRENT_COMMAND_FIELDS=1
          export OPENCODE2_NATIVE_REQUIRED=1
          export OPENCODE_GOAL_V2_PLUGIN_URL="file://$GITHUB_WORKSPACE/companion-goal/dist/server.js"
          node scripts/opencode2-loop-canary.mjs
          node scripts/native-cli-host-canary.mjs
          (cd companion-goal && node scripts/opencode2-unit-handoff-canary.mjs)
      - name: Store verified content without changing branches
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const paths = ['src/source/runtime/job-workspace.js', 'scripts/control-plane-until-test.mjs', 'src/index.js', 'src/server.js', 'src/native.js', 'package.json', 'docs/OPENCODE2-CONTROL-STATE.md']
          for (const path of paths) {
            const data = readFileSync(path)
            const expected = createHash('sha1').update(`blob ${data.length}\0`).update(data).digest('hex')
            const response = await fetch('https://api.github.com/repos/ByBrawe/opencode-loop/git/blobs', {
              method: 'POST',
              headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, 'Content-Type': 'application/json' },
              body: JSON.stringify({ content: data.toString('base64'), encoding: 'base64' }),
            })
            if (!response.ok) throw new Error(`blob HTTP ${response.status}`)
            const blob = await response.json()
            if (blob.sha !== expected) throw new Error('verified blob mismatch')
            console.log(`VERIFIED_FILE ${path} ${blob.sha}`)
          }
          console.log(`CHECKOUT ${process.env.GITHUB_SHA}; GOAL 16a276bb219a512d9a7d2a4dd8b6883eb76b9b54`)
          console.log('No branch or commit modified by this validation job.')
          JS
