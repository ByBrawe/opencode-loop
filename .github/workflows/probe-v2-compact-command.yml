name: Probe V2 compact command

# Temporary branch-only probe; rerun with session wrapper inspection.
on:
  push:
    branches: [feat-v2-compact-runtime-20260814]
    paths:
      - .github/workflows/probe-v2-compact-command.yml

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat-v2-compact-runtime-20260814
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Isolate OpenCode 2 paths
        shell: bash
        run: |
          echo "HOME=$RUNNER_TEMP/opencode2-home" >> "$GITHUB_ENV"
          echo "XDG_CONFIG_HOME=$RUNNER_TEMP/opencode2-home/.config" >> "$GITHUB_ENV"
          echo "XDG_DATA_HOME=$RUNNER_TEMP/opencode2-home/.local/share" >> "$GITHUB_ENV"
          echo "XDG_STATE_HOME=$RUNNER_TEMP/opencode2-home/.local/state" >> "$GITHUB_ENV"
      - run: npm install -g --allow-scripts=@opencode-ai/cli @opencode-ai/cli@next
      - name: Prepare probe project
        shell: bash
        run: |
          project="$RUNNER_TEMP/opencode-loop-v2-compact-probe"
          plugin_dir="$project/.opencode/plugins"
          marker="$project/v2-compact-wrapper-marker.json"
          mkdir -p "$plugin_dir" "$HOME" "$XDG_CONFIG_HOME" "$XDG_DATA_HOME" "$XDG_STATE_HOME"
          git init --quiet "$project"
          git -C "$project" config user.email "opencode-loop-ci@example.invalid"
          git -C "$project" config user.name "OpenCode Loop CI"
          touch "$project/README.md"
          cat > "$plugin_dir/compact-wrapper-probe.js" <<'EOF'
          import { writeFile } from "node:fs/promises"

          const marker = new URL("../../v2-compact-wrapper-marker.json", import.meta.url)
          const source = (fn) => typeof fn === "function" ? String(fn).slice(0, 2400) : ""

          export default {
            id: "bybrawe.opencode-loop.v2.compact-wrapper-probe",
            async setup(ctx) {
              await writeFile(marker, JSON.stringify({
                methods: Object.fromEntries(Object.keys(ctx?.session || {}).sort().map((key) => [key, typeof ctx.session[key]])),
                create: source(ctx?.session?.create),
                command: source(ctx?.session?.command),
                prompt: source(ctx?.session?.prompt),
                synthetic: source(ctx?.session?.synthetic),
              }, null, 2), "utf8")
            },
          }
          EOF
          git -C "$project" add .
          git -C "$project" commit --quiet -m "init"
          echo "OPENCODE_LOOP_V2_PROJECT=$project" >> "$GITHUB_ENV"
          echo "OPENCODE_LOOP_V2_MARKER=$marker" >> "$GITHUB_ENV"
      - name: Inspect command registry and session wrappers
        shell: bash
        run: |
          out="$RUNNER_TEMP/opencode2-command-registry.json"
          rm -f "$OPENCODE_LOOP_V2_MARKER"
          opencode2 api get /api/command -H "x-opencode-directory: $OPENCODE_LOOP_V2_PROJECT" > "$out"
          cat "$out"
          node - <<'NODE' "$out"
          const fs = require('node:fs')
          const file = process.argv[2]
          const value = JSON.parse(fs.readFileSync(file, 'utf8'))
          const rows = Array.isArray(value) ? value : value?.data || value?.commands || []
          const ids = rows.map((item) => String(item?.id || item?.name || item?.command || '')).filter(Boolean)
          console.log('COMMAND_IDS=' + JSON.stringify(ids))
          console.log('COMPACT_MATCHES=' + JSON.stringify(rows.filter((item) => /compact/i.test(JSON.stringify(item)))))
          NODE
          for attempt in $(seq 1 50); do
            if [ -f "$OPENCODE_LOOP_V2_MARKER" ]; then
              echo "--- SESSION WRAPPERS ---"
              cat "$OPENCODE_LOOP_V2_MARKER"
              exit 0
            fi
            sleep 0.2
          done
          echo "wrapper probe marker missing" >&2
          exit 1
