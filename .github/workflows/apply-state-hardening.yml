name: Apply state write hardening

on:
  push:
    branches:
      - fix/state-write-retry-hardening

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/state-write-retry-hardening

      - name: Apply focused patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "src/index.js",
              '''async function readState(directory, sessionID) {
            const target = statePath(directory, sessionID)
            try {
              const parsed = JSON.parse(await fs.readFile(target, "utf8"))
              return { version: 4, jobs: Array.isArray(parsed.jobs) ? parsed.jobs : [] }
            } catch (error) {
              if (error?.code !== "ENOENT") {
                try {
                  await ensureDir(stateDir(directory))
                  await fs.copyFile(target, `${target}.corrupt-${Date.now()}`)
                } catch {}
              }
              return { version: 4, jobs: [] }
            }
          }
          ''',
              '''async function readState(directory, sessionID) {
            const target = statePath(directory, sessionID)
            const attempts = 5
            for (let attempt = 0; attempt < attempts; attempt++) {
              try {
                const parsed = JSON.parse(await fs.readFile(target, "utf8"))
                return { version: 4, jobs: Array.isArray(parsed.jobs) ? parsed.jobs : [] }
              } catch (error) {
                if (error?.code === "ENOENT") return { version: 4, jobs: [] }
                const transient = error instanceof SyntaxError || isRetriableStateWriteError(error)
                if (!transient || attempt === attempts - 1) break
                await delay(25 * (attempt + 1))
              }
            }
            try {
              await ensureDir(stateDir(directory))
              await fs.copyFile(target, `${target}.corrupt-${Date.now()}`)
            } catch {}
            return { version: 4, jobs: [] }
          }
          ''',
          )

          replace_once(
              "src/index.js",
              '''async function writeFileAtomically(target, contents, options = {}) {
            const encoding = options.encoding || "utf8"
            const attempts = Math.max(1, Number(options.attempts) || 5)
            const temp = path.join(
              os.tmpdir(),
              `opencode-loop-${process.pid}-${Date.now()}-${Math.random().toString(16).slice(2)}.tmp`,
            )
            await fs.writeFile(temp, contents, encoding)
            try {
              let lastError
              for (let attempt = 0; attempt < attempts; attempt++) {
                try {
                  await fs.rename(temp, target)
                  return
                } catch (error) {
                  lastError = error
                  const code = error?.code
                  // Cross-device rename is expected when the project is not on the temp volume.
                  // On Windows, rename-over-existing can also fail while the destination is locked.
                  if (code === "EXDEV" || isRetriableStateWriteError(error)) {
                    try {
                      await fs.copyFile(temp, target)
                      return
                    } catch (copyError) {
                      lastError = copyError
                      // Last resort: direct overwrite. Less atomic, but better than dropping jobs.
                      if (attempt === attempts - 1) {
                        await fs.writeFile(target, contents, encoding)
                        return
                      }
                      if (!isRetriableStateWriteError(copyError)) throw copyError
                    }
                  } else if (attempt === attempts - 1) {
                    try {
                      await fs.writeFile(target, contents, encoding)
                      return
                    } catch {
                      throw error
                    }
                  }
                }
                await delay(25 * (attempt + 1))
              }
              throw lastError || new Error(`Failed to write ${target}`)
            } finally {
              try { await fs.rm(temp, { force: true }) } catch {}
            }
          }
          ''',
              '''async function writeFileAtomically(target, contents, options = {}) {
            const encoding = options.encoding || "utf8"
            const attempts = Math.max(1, Number(options.attempts) || 5)
            const temp = path.join(
              os.tmpdir(),
              `opencode-loop-${process.pid}-${Date.now()}-${Math.random().toString(16).slice(2)}.tmp`,
            )
            await fs.writeFile(temp, contents, encoding)
            try {
              let lastError
              // Prefer an atomic rename and retry transient Windows destination locks
              // before falling back to a non-atomic copy/overwrite.
              for (let attempt = 0; attempt < attempts; attempt++) {
                try {
                  await fs.rename(temp, target)
                  return
                } catch (error) {
                  lastError = error
                  if (error?.code === "EXDEV") break
                  if (!isRetriableStateWriteError(error)) throw error
                  if (attempt < attempts - 1) await delay(25 * (attempt + 1))
                }
              }

              for (let attempt = 0; attempt < attempts; attempt++) {
                try {
                  await fs.copyFile(temp, target)
                  return
                } catch (error) {
                  lastError = error
                  if (!isRetriableStateWriteError(error)) throw error
                  if (attempt < attempts - 1) await delay(25 * (attempt + 1))
                }
              }

              try {
                await fs.writeFile(target, contents, encoding)
                return
              } catch (error) {
                if (lastError && !error.cause) error.cause = lastError
                throw error
              }
            } finally {
              try { await fs.rm(temp, { force: true }) } catch {}
            }
          }
          ''',
          )

          replace_once(
              "scripts/comprehensive-test.mjs",
              '''    records,
              sessionID,
              statuses,
              async command(command, argumentsText = "", output = { parts: [] }) {''',
              '''    records,
              sessionID,
              stateFile,
              statuses,
              async command(command, argumentsText = "", output = { parts: [] }) {''',
          )

          marker = '''await testParserAndPresets()
          await testLifecycleAndCommandDedupe()'''
          tests = r'''async function testWindowsStateRenameRetriesBeforeFallback() {
            const h = await createHarness()
            const originalRename = fs.rename
            const originalCopyFile = fs.copyFile
            let renameAttempts = 0
            let fallbackCopies = 0
            fs.rename = async (source, target) => {
              if (target === h.stateFile && renameAttempts++ < 2) {
                const error = new Error("simulated Windows destination lock")
                error.code = "EPERM"
                throw error
              }
              return await originalRename(source, target)
            }
            fs.copyFile = async (source, target, ...rest) => {
              if (target === h.stateFile) fallbackCopies++
              return await originalCopyFile(source, target, ...rest)
            }
            try {
              await h.command("loop", "10m --no-now --name retry-safe keep-state")
              const state = await h.readState()
              assert.equal(state.jobs[0]?.name, "retry-safe")
              assert.equal(renameAttempts, 3, "transient EPERM should retry rename")
              assert.equal(fallbackCopies, 0, "successful rename retry should avoid non-atomic copy fallback")
            } finally {
              fs.rename = originalRename
              fs.copyFile = originalCopyFile
              await h.cleanup()
            }
          }

          async function testStateReadRetriesTransientPartialJson() {
            const h = await createHarness()
            const originalReadFile = fs.readFile
            try {
              await h.command("loop", "10m --no-now --name sticky survive-partial-read")
              let partialReads = 0
              fs.readFile = async (filePath, ...rest) => {
                if (filePath === h.stateFile && partialReads++ < 2) return "{"
                return await originalReadFile(filePath, ...rest)
              }
              await h.command("loop-status")
              assert.equal(partialReads, 3, "partial JSON should be retried before treating state as corrupt")
              assert.equal(h.records.toasts.at(-1)?.message, "1 loop job(s).")
            } finally {
              fs.readFile = originalReadFile
              await h.cleanup()
            }
          }

          await testParserAndPresets()
          await testLifecycleAndCommandDedupe()'''
          replace_once("scripts/comprehensive-test.mjs", marker, tests)

          replace_once(
              "scripts/comprehensive-test.mjs",
              '''await testWindowsSafeStatePersistence()

          console.log("OpenCode Loop comprehensive test passed")''',
              '''await testWindowsSafeStatePersistence()
          await testWindowsStateRenameRetriesBeforeFallback()
          await testStateReadRetriesTransientPartialJson()

          console.log("OpenCode Loop comprehensive test passed")''',
          )

          replace_once(
              "README.md",
              '''## Example progress.md

          Create one with:

          ## Example progress.md

          Create one with:
          ''',
              '''## Example progress.md

          Create one with:
          ''',
          )
          PY

      - name: Syntax checks
        run: |
          node --check src/index.js
          node --check scripts/comprehensive-test.mjs

      - name: Remove one-shot workflow and commit patch
        shell: bash
        run: |
          rm .github/workflows/apply-state-hardening.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.js scripts/comprehensive-test.mjs README.md .github/workflows/apply-state-hardening.yml
          git commit -m "fix: harden Windows state persistence"
          git push origin HEAD:fix/state-write-retry-hardening
