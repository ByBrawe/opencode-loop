name: One-shot V2 registry ordering sync

on:
  push:
    branches:
      - test/v2-real-loop-canary-current
    paths:
      - ".github/workflows/v2-canary-registry-order-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/v2-real-loop-canary-current
      - name: Patch registry ordering and remove helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/opencode2-loop-canary.mjs')
          text = path.read_text()
          old = '''    commandNames = collectCommandNames(registryResponse.body)
          assert.ok(commandNames.has("loop"), `OpenCode 2 did not register the project loop command: ${registryResponse.text}\\n${await diagnostics()}`)

          await waitFor(async () => {
            try { return Boolean(JSON.parse(await readFile(marker, "utf8"))?.activated) } catch { return false }
          }, "real V2 adapter activation on the explicit serve process", diagnostics, 30_000)
          '''
          new = '''    await waitFor(async () => {
            try { return Boolean(JSON.parse(await readFile(marker, "utf8"))?.activated) } catch { return false }
          }, "real V2 adapter activation on the explicit serve process", diagnostics, 30_000)

          await waitFor(async () => {
            const current = await request(`${apiPrefix}/command`, { method: "GET" }, { timeoutMs: 5_000, allowHttpError: true })
            if (!current.ok) return false
            registryResponse = current
            commandNames = collectCommandNames(current.body)
            return commandNames.has("loop")
          }, "plugin-registered V2 Loop commands to enter the command registry", diagnostics, 30_000)
          '''
          if old not in text:
              raise SystemExit('target registry block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/v2-canary-registry-order-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/opencode2-loop-canary.mjs
          git commit -m "test: wait for V2 command registration"
          git push origin HEAD:test/v2-real-loop-canary-current
