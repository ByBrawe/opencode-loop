name: Probe OpenCode V2 Command

on:
  push:
    branches: [probe-opencode-v2-contract]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe-command:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - run: npm install -g @opencode-ai/cli@next
      - run: opencode2 --version
      - name: Read V2 commands
        run: opencode2 api -H "x-opencode-directory:$(pwd)" get /api/command
