name: V2 Status Tool Contract

on:
  pull_request:
    paths:
      - "src/source/opencode2/status-tool.js"
      - "src/source/opencode2/experimental.js"
      - "scripts/v2-status-tool-test.mjs"
      - ".github/workflows/v2-status-tool.yml"
  push:
    branches: [main]
    paths:
      - "src/source/opencode2/status-tool.js"
      - "src/source/opencode2/experimental.js"
      - "scripts/v2-status-tool-test.mjs"
      - ".github/workflows/v2-status-tool.yml"

permissions:
  contents: read

jobs:
  status-tool:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: node --check src/source/opencode2/status-tool.js
      - run: node --check scripts/v2-status-tool-test.mjs
      - run: node scripts/v2-status-tool-test.mjs
