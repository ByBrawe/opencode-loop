name: V2 Host Activation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v2-host-activation.yml"
      - "scripts/opencode2-host-canary.mjs"

permissions:
  contents: read

jobs:
  activation:
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Install current V2 plugin package
        run: npm install --no-save --package-lock=false @opencode-ai/plugin@next

      - name: Install OpenCode 2 beta
        run: npm install -g @opencode-ai/cli@next

      - name: Verify V2 canary syntax
        run: |
          node --check src/source/opencode2/capabilities.js
          node --check src/source/opencode2/experimental.js
          node --check scripts/opencode2-host-canary.mjs

      - name: Show OpenCode 2 version
        run: opencode2 --version

      - name: Run real OpenCode 2 activation probe
        id: canary
        continue-on-error: true
        run: node scripts/opencode2-host-canary.mjs

      - name: Report V2 activation outcome
        if: always()
        env:
          V2_ACTIVATION_OUTCOME: ${{ steps.canary.outcome }}
        run: node -e "console.log('OpenCode 2 activation probe outcome:', process.env.V2_ACTIVATION_OUTCOME)"
