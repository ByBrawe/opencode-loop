name: Prepare 0.5.33 release metadata

on:
  push:
    branches:
      - "release/prepare-v0.5.33"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Update release metadata
        shell: bash
        run: |
          npm version 0.5.33 --no-git-tag-version
          node <<'NODE'
          const fs = require('node:fs')

          const changelogPath = 'CHANGELOG.md'
          let changelog = fs.readFileSync(changelogPath, 'utf8')
          const marker = '# Changelog\n\n'
          if (!changelog.startsWith(marker)) throw new Error('unexpected changelog header')
          if (changelog.includes('\n## 0.5.33\n')) throw new Error('0.5.33 changelog already exists')
          const section = [
            '## 0.5.33',
            '',
            '- Complete the post-0.5.32 stable V1 source decomposition by extracting action dispatch, run admission, and post-turn finalization from the executor into focused runtime modules while preserving scheduler behavior and dependency-injection compatibility.',
            '- Split experimental Loop Goal prompt rendering, report writing, and evidence/progress decision helpers into dedicated modules while preserving the existing source facade and runtime state schema.',
            '- Regenerate the committed single-file stable plugin from the modular source tree and keep Linux/Windows real-host, compatibility, generated-bundle, and lifecycle gates green throughout the refactor.',
            '- Add direct regression coverage for the extracted admission/finalization paths; this release is intended to be behavior-preserving with no user-visible command changes.',
            '',
          ].join('\n')
          fs.writeFileSync(changelogPath, marker + section + changelog.slice(marker.length), 'utf8')

          const readmePath = 'README.md'
          let readme = fs.readFileSync(readmePath, 'utf8')
          const before = '**Current release: `0.5.32`.**'
          const after = '**Current release: `0.5.33`.**'
          if (!readme.includes(before)) throw new Error('current release marker not found in README')
          readme = readme.replace(before, after)
          fs.writeFileSync(readmePath, readme, 'utf8')
          NODE

      - name: Commit prepared release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-0.5.33.yml
          git add package.json package-lock.json CHANGELOG.md README.md
          git diff --cached --check
          git commit -m "chore: prepare 0.5.33 release metadata"
          git push origin HEAD:release/prepare-v0.5.33
