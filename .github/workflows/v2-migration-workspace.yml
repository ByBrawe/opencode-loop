name: Verify native migration repair
on:
  push:
    branches: [fix/opencode2-native-compaction-164]
    paths:
      - .github/workflows/v2-migration-workspace.yml
      - .github/scripts/repair-*.mjs
permissions:
  contents: write
concurrency:
  group: isolated-native-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/opencode2-native-compaction-164
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - name: Apply provenance repair once
        run: |
          if ! grep -q 'compactingSessions' src/source/runtime/goal-steering.js; then
            node .github/scripts/repair-164.mjs
          fi
      - name: Build and verify exact repaired bundles
        run: |
          npm run build:plugin
          npm run check
          node scripts/goal-compaction-safety-test.mjs
          node scripts/goal-steering-test.mjs
          node scripts/compaction-runtime-test.mjs
          node scripts/server-entry-test.mjs
      - name: Commit verified source and generated bundles to repair branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/source/runtime/goal-steering.js src/source/legacy-v1.js src/index.js src/server.js package.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix: never abort core compaction from persisted user events (#164)'
            git push origin HEAD:refs/heads/fix/opencode2-native-compaction-164
          fi
      - name: Install exact native host
        run: npm install --prefix /tmp/native-host --package-lock=false @opencode/cli@2.0.18 @opencode/plugin@2.0.18
      - name: Inspect public admission interfaces
        run: |
          ls -l /tmp/native-host/node_modules/.bin
          find /tmp/native-host/node_modules -path '*/generated/types.d.ts' -exec grep -A 22 -E '^export (type|interface) Session(Inbox(Cancel|List|Get)|Prompt|Shell)(Input|Output)' {} \;
      - name: Run real OpenCode 2 native Loop canary
        run: |
          BINARY=/tmp/native-host/node_modules/.bin/opencode2
          if [ ! -x "$BINARY" ]; then BINARY=/tmp/native-host/node_modules/.bin/opencode; fi
          "$BINARY" --version
          OPENCODE2_BINARY="$BINARY" OPENCODE2_CURRENT_COMMAND_FIELDS=1 node scripts/opencode2-loop-canary.mjs
