name: V2 migration workspace
on:
  push:
    branches: [fix/opencode2-native-compaction-164]
    paths: [.github/workflows/v2-migration-workspace.yml]
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned official native host
        run: npm install --prefix host --package-lock=false @opencode/cli@2.0.18 @opencode/plugin@2.0.18
      - name: Archive public host packages only
        run: tar -czf v2-native-host.tar.gz host
      - uses: actions/upload-artifact@v4
        with:
          name: v2-native-host
          path: v2-native-host.tar.gz
          retention-days: 1
          if-no-files-found: error
