name: One-shot 0.5.34 release metadata prep

on:
  push:
    branches:
      - release/0.5.34-prep
    paths:
      - .github/workflows/prepare-0.5.34-once.yml

permissions:
  contents: write

jobs:
  prepare:
    if: github.repository == 'ByBrawe/opencode-loop' && github.ref == 'refs/heads/release/0.5.34-prep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - name: Update release metadata and docs
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs')
          const version = '0.5.34'

          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.version = version
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')

          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'))
          lock.version = version
          if (lock.packages && lock.packages['']) lock.packages[''].version = version
          fs.writeFileSync('package-lock.json', JSON.stringify(lock, null, 2) + '\n')

          let readme = fs.readFileSync('README.md', 'utf8')
          const stableLine = /\*\*Current stable release: `0\.5\.33`\.\*\*[^\n]*/
          if (!stableLine.test(readme)) throw new Error('README stable-version marker not found')
          readme = readme.replace(stableLine, '**Current stable release: `0.5.34`.**')
          fs.writeFileSync('README.md', readme)

          let changelog = fs.readFileSync('CHANGELOG.md', 'utf8')
          if (!changelog.includes('## 0.5.34')) {
            const marker = '# Changelog\n\n'
            if (!changelog.startsWith(marker)) throw new Error('CHANGELOG header not found')
            const entry = `## 0.5.34\n\n- Make plain \`/loop <prompt>\` the ergonomic unlimited idle-continuation form: when the assistant stops and the session is safely idle, Loop sends the prompt again. Add explicit \`idle\`, recurring \`every <duration>\`, and one-shot \`after/in <duration>\` schedule grammar while preserving legacy duration-first commands.\n- Treat short continuation prompts such as \`continue\`, \`keep going\`, and \`devam et\` as continuation of the current repository/conversation, with guidance to inspect relevant files, TODO/progress state, recent changes, and git status before choosing the next unfinished step.\n- Fix the pre-first-run stale OpenCode \`busy/retry\` failure mode that could leave an enabled immediate Loop at \`runCount=0\`: recover only when the latest assistant tail is actually completed and no active tool or busy child session exists.\n- Add throttled busy-deferral logging, schedule/state detail in \`/loop-status\`, and cross-session persisted-job diagnostics in \`/loop-doctor\` so due work explains why it is waiting instead of leaving only an \`add\` log record.\n- Prevent prompt-producing Loop jobs from competing with an active dedicated \`/goal\` continuation owner in the same session by default; advanced users can opt in explicitly with \`--allow-goal-overlap\`.\n- Centralize due/admission semantics in a shared schedule-policy runtime and split schedule syntax, continuation guidance, scheduler diagnostics, companion-Goal detection, and Loop diagnostics into focused modules. Keep the committed single-file stable bundle synchronized and add a permanent Bundle Gate check that fails when \`src/index.js\` is stale.\n- Rewrite the scheduling documentation, add \`docs/SCHEDULING.md\`, and extend real OpenCode host coverage so Ubuntu and Windows prove a durationless \`/loop --max-runs 3 devam et\` performs exactly three autonomous turns and stops at the configured limit.\n\n`
            changelog = marker + entry + changelog.slice(marker.length)
            fs.writeFileSync('CHANGELOG.md', changelog)
          }
          NODE
      - name: Require release-only diff
        shell: bash
        run: |
          CHANGED="$(git diff --name-only | sort)"
          EXPECTED="CHANGELOG.md
          README.md
          package-lock.json
          package.json"
          if [ "$CHANGED" != "$EXPECTED" ]; then
            echo "Unexpected release metadata diff:"
            printf '%s\n' "$CHANGED"
            exit 1
          fi
      - name: Commit release metadata
        shell: bash
        run: |
          git config user.name "OpenCode Loop CI"
          git config user.email "opencode-loop-ci@example.invalid"
          git add CHANGELOG.md README.md package.json package-lock.json
          git commit -m "chore: prepare 0.5.34 release metadata"
          git push origin HEAD:release/0.5.34-prep
