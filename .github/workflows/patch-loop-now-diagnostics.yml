name: Patch loop-now canary diagnostics

# Second push triggers the one-shot helper after the workflow exists on the branch.
on:
  push:
    branches:
      - test/stable-loop-now-real-host
    paths:
      - ".github/workflows/patch-loop-now-diagnostics.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/stable-loop-now-real-host
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Patch diagnostics and remove helper
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const file = 'scripts/host-loop-canary.mjs'
          let text = fs.readFileSync(file, 'utf8')
          const oldWait = '  throw new Error(`timed out waiting for ${description}\\n${diagnostics()}`)'
          const newWait = '  const detail = typeof diagnostics === "function" ? await diagnostics() : diagnostics\n  throw new Error(`timed out waiting for ${description}\\n${detail}`)'
          if (!text.includes(oldWait)) throw new Error('waitFor diagnostic marker not found')
          text = text.replace(oldWait, newWait)
          const oldDiag = '    const diagnostics = async () => {\n      let state = "missing"\n      try { state = await readFile(stateFile, "utf8") } catch {}\n      return `provider=${JSON.stringify(provider.stats)}\\ncommandError=${String(commandError ?? "none")}\\nstate=${state}\\nserver log:\\n${serverLog}`\n    }'
          const newDiag = '    const diagnostics = async () => {\n      let state = "missing"\n      let loopLog = "missing"\n      try { state = await readFile(stateFile, "utf8") } catch {}\n      try { loopLog = await readFile(path.join(workspace, ".opencode", "opencode-loop", "loop.log"), "utf8") } catch {}\n      return `provider=${JSON.stringify(provider.stats)}\\ncommandError=${String(commandError ?? "none")}\\nstate=${state}\\nloop log:\\n${loopLog}\\nserver log:\\n${serverLog}`\n    }'
          if (!text.includes(oldDiag)) throw new Error('diagnostics block marker not found')
          text = text.replace(oldDiag, newDiag)
          const oldRunNow = '    await waitFor(() => provider.stats.runNowSequence.length >= 1, "targeted real-host loop-now turn", () => `provider=${JSON.stringify(provider.stats)}\\nserver log:\\n${serverLog}`)'
          const newRunNow = '    await waitFor(() => provider.stats.runNowSequence.length >= 1, "targeted real-host loop-now turn", diagnostics)'
          if (!text.includes(oldRunNow)) throw new Error('run-now wait marker not found')
          text = text.replace(oldRunNow, newRunNow)
          fs.writeFileSync(file, text)
          NODE
          rm .github/workflows/patch-loop-now-diagnostics.yml
          git config user.email "opencode-loop-ci@example.invalid"
          git config user.name "OpenCode Loop CI"
          git add scripts/host-loop-canary.mjs .github/workflows/patch-loop-now-diagnostics.yml
          git commit -m "test: add loop-now timeout state diagnostics"
          git push origin HEAD:test/stable-loop-now-real-host
