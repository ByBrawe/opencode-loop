name: OpenCode 2 Plugin Probe

on:
  push:
    branches: [v2-real-host-sentinel]

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false @opencode-ai/cli@0.0.0-next-17430 @opencode-ai/plugin@0.0.0-next-17430
      - name: Show exact CLI commands
        run: ./node_modules/.bin/opencode2 --help
      - name: Show exact plugin command help
        run: ./node_modules/.bin/opencode2 plugin --help
