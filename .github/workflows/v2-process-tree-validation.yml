name: Native process tree validation

on:
  push:
    branches: [main]
    paths: ['.github/workflows/v2-process-tree-validation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'ByBrawe/opencode-loop' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - name: Build shipped entries from corrected source
        run: npm run build:plugin
      - name: Full checks and package verification
        shell: bash
        run: |
          npm run check > "$RUNNER_TEMP/check.log" 2>&1 || { tail -80 "$RUNNER_TEMP/check.log"; exit 1; }
          npm test > "$RUNNER_TEMP/test.log" 2>&1 || { tail -120 "$RUNNER_TEMP/test.log"; exit 1; }
          tail -60 "$RUNNER_TEMP/test.log"
          npm run package:smoke
          git diff --check
          git diff --exit-code -- src/index.js src/server.js
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: matrix.os == 'ubuntu-latest'
        with:
          repository: ByBrawe/opencode-goal
          ref: 08c54b5c28b6e811713a4dc01b22f68d2bb2400c
          path: companion-goal
          persist-credentials: false
      - name: Build exact corrected Goal companion
        if: matrix.os == 'ubuntu-latest'
        working-directory: companion-goal
        run: npm install && npm run build
      - name: Install exact native host
        if: matrix.os == 'ubuntu-latest'
        run: npm install --prefix /tmp/process-tree-host --package-lock=false @opencode/cli@2.0.18
      - name: Both corrected plugins on OpenCode 2.0.18
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          OPENCODE2_BINARY: /tmp/process-tree-host/node_modules/.bin/opencode2
          OPENCODE2_CURRENT_COMMAND_FIELDS: '1'
          OPENCODE2_NATIVE_REQUIRED: '1'
        run: |
          test "$("$OPENCODE2_BINARY" --version)" = 'opencode v2.0.18'
          export OPENCODE_GOAL_V2_PLUGIN_URL="file://$GITHUB_WORKSPACE/companion-goal/dist/server.js"
          node scripts/opencode2-loop-canary.mjs
      - name: Preserve the verified native bundle without updating branches
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const data = readFileSync('src/native.js')
          const expected = createHash('sha1').update(`blob ${data.length}\0`).update(data).digest('hex')
          const response = await fetch('https://api.github.com/repos/ByBrawe/opencode-loop/git/blobs', {
            method: 'POST',
            headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, 'Content-Type': 'application/json' },
            body: JSON.stringify({ content: data.toString('base64'), encoding: 'base64' }),
          })
          if (!response.ok) throw new Error(`blob upload HTTP ${response.status}`)
          const blob = await response.json()
          if (blob.sha !== expected) throw new Error('native bundle digest mismatch')
          console.log(`VERIFIED_NATIVE_BLOB ${blob.sha} CHECKOUT ${process.env.GITHUB_SHA}`)
          console.log('No branch was updated by this validation job.')
          JS
