name: Sync generated stable bundle

# Second push intentionally triggers this one-shot helper after it exists on the branch.
on:
  push:
    branches:
      - test/stable-loop-now-real-host
    paths:
      - ".github/workflows/sync-generated-bundle.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: test/stable-loop-now-real-host
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run build:plugin
      - name: Commit generated stable plugin and remove helper
        shell: bash
        run: |
          rm .github/workflows/sync-generated-bundle.yml
          git config user.email "opencode-loop-ci@example.invalid"
          git config user.name "OpenCode Loop CI"
          git add src/index.js .github/workflows/sync-generated-bundle.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: sync generated stable plugin"
          git push origin HEAD:test/stable-loop-now-real-host
