name: V2 audit workspace

on:
  push:
    paths: ['.github/workflows/v2-audit-workspace.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          path: loop
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          repository: ByBrawe/opencode-goal
          ref: 612612d01e1dd71c19994fe27ef03be58a38f7bf
          path: goal
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.2'
      - run: npm ci
        working-directory: loop
      - run: npm install && npm run build
        working-directory: goal
      - name: Install exact native host
        run: npm install --prefix host --package-lock=false @opencode/cli@2.0.18
      - name: Archive only source and public dependencies
        shell: bash
        run: |
          mkdir -p audit/loop audit/goal audit/host audit/tools
          for repo in loop goal; do
            git -C "$repo" archive HEAD | tar -x -C "audit/$repo"
            cp -a "$repo/node_modules" "audit/$repo/"
            printf '%s=%s\n' "$repo" "$(git -C "$repo" rev-parse HEAD)" >> audit/source-refs.txt
          done
          cp -a host/node_modules audit/host/
          cp "$(command -v bun)" audit/tools/bun
          tar -czf native-audit-workspace.tar.gz -C audit .
      - uses: actions/upload-artifact@v7
        with:
          name: native-audit-workspace
          path: native-audit-workspace.tar.gz
          retention-days: 2
          if-no-files-found: error
