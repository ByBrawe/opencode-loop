name: Fix PR12 smoke regression

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'chore/community-regressions-goal-readme'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - name: Restore unchanged background regression line
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/smoke-test.mjs')
          text = p.read_text()
          old = '  await hooks.event({ event: { type: "session.status", properties: { sessionID: childSessionID, status: { type: "idle" } } })\n'
          new = '  await hooks.event({ event: { type: "session.status", properties: { sessionID: childSessionID, status: { type: "idle" } } } })\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one broken child-idle line, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          node --check scripts/smoke-test.mjs
      - name: Commit precise fix
        shell: bash
        run: |
          rm .github/workflows/fix-pr12-smoke.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/smoke-test.mjs .github/workflows/fix-pr12-smoke.yml
          git commit -m "test: restore background regression event shape"
          git push origin HEAD:${{ github.head_ref }}
