name: Normalize 0.5.33 changelog spacing

on:
  push:
    branches:
      - "release/prepare-v0.5.33"

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Fix spacing and self-remove
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const path = 'CHANGELOG.md'
          let text = fs.readFileSync(path, 'utf8')
          const before = 'this release is intended to be behavior-preserving with no user-visible command changes.\n## 0.5.32'
          const after = 'this release is intended to be behavior-preserving with no user-visible command changes.\n\n## 0.5.32'
          if (!text.includes(before)) throw new Error('expected changelog boundary not found')
          text = text.replace(before, after)
          fs.writeFileSync(path, text, 'utf8')
          NODE
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-0.5.33-changelog.yml
          git add CHANGELOG.md
          git diff --cached --check
          git commit -m "chore: normalize 0.5.33 changelog spacing"
          git push origin HEAD:release/prepare-v0.5.33
