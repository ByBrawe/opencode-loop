name: Apply v0.5.21 on PR

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'release/v0.5.21-opencode-1.18'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Apply patch
        run: python scripts/apply-v0521.py
      - name: Generate lockfile
        run: npm install --package-lock-only --ignore-scripts
      - name: Verify candidate
        run: |
          npm ci
          npm run check
          npm test
          npm pack --dry-run
      - name: Commit verified candidate
        shell: bash
        run: |
          rm -f .github/workflows/apply-v0521.yml .github/workflows/apply-v0521-pr.yml .v0521-trigger scripts/apply-v0521.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: prepare v0.5.21 for OpenCode 1.18"
          git push origin HEAD:${{ github.head_ref }}
