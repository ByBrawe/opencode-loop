name: V2 command parity candidate

on:
  push:
    branches: [main]
    paths: ['.github/workflows/v2-presets-validation.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-presets:
    if: github.repository == 'ByBrawe/opencode-loop' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 18
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - name: Load immutable command parity candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { writeFileSync } from 'node:fs'
          const response = await fetch('https://api.github.com/repos/ByBrawe/opencode-loop/git/blobs/1b1f37eb874e93fda38b018b340303dde236da51', { headers: { Authorization: `Bearer ${process.env.GH_TOKEN}` } })
          if (!response.ok) throw new Error(`recipe HTTP ${response.status}`)
          const blob = await response.json()
          writeFileSync(`${process.env.RUNNER_TEMP}/command-parity.py`, Buffer.from(blob.content, 'base64'))
          JS
      - name: Reproduce missing commands and mismatched preset defaults
        shell: bash
        run: |
          python "$RUNNER_TEMP/command-parity.py" tests
          node --check scripts/native-presets-test.mjs
          if node --test scripts/native-presets-test.mjs > "$RUNNER_TEMP/baseline.log" 2>&1; then
            cat "$RUNNER_TEMP/baseline.log"
            echo 'Command regressions unexpectedly passed on original source'
            exit 1
          fi
          tail -90 "$RUNNER_TEMP/baseline.log"
          grep -q 'not ok.*native loop-dev preserves' "$RUNNER_TEMP/baseline.log"
          grep -q 'not ok.*native loop-init creates' "$RUNNER_TEMP/baseline.log"
          python "$RUNNER_TEMP/command-parity.py" fix
      - name: Build and verify full corrected suites
        shell: bash
        run: |
          npm run build:plugin
          npm run check > "$RUNNER_TEMP/check.log" 2>&1 || { tail -90 "$RUNNER_TEMP/check.log"; exit 1; }
          npm test > "$RUNNER_TEMP/tests.log" 2>&1 || { tail -200 "$RUNNER_TEMP/tests.log"; exit 1; }
          tail -100 "$RUNNER_TEMP/tests.log"
          npm run package:smoke
          git diff --check
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: matrix.os == 'ubuntu-latest'
        with:
          repository: ByBrawe/opencode-goal
          ref: da4b1c1745e4fa76cf38f982c9582adf880fc7eb
          path: companion-goal
          persist-credentials: false
      - name: Real 2.0.18 command registry, presets, progress initialization and daemon
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          (cd companion-goal && npm install && npm run build)
          export OPENCODE_GOAL_INSTALLER="$GITHUB_WORKSPACE/companion-goal/dist/install.js"
          node scripts/native-install-pair-test.mjs
          npm install --prefix "$RUNNER_TEMP/native-host" --package-lock=false @opencode/cli@2.0.18
          export OPENCODE2_BINARY="$RUNNER_TEMP/native-host/node_modules/.bin/opencode2"
          export OPENCODE2_CURRENT_COMMAND_FIELDS=1
          export OPENCODE2_NATIVE_REQUIRED=1
          export OPENCODE_GOAL_V2_PLUGIN_URL="file://$GITHUB_WORKSPACE/companion-goal/dist/server.js"
          node scripts/opencode2-loop-canary.mjs
          node scripts/native-cli-host-canary.mjs
      - name: Preserve verified files without updating branches
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs'
          import { createHash } from 'node:crypto'
          const paths = ['src/source/core/progress.js', 'src/source/opencode/loop-commands.js', 'src/source/opencode2/commands.js', 'src/source/opencode2/native-runtime.js', 'src/source/opencode2/native-plugin.js', 'scripts/native-presets-test.mjs', 'scripts/opencode2-loop-canary.mjs', 'package.json', 'docs/OPENCODE2-COMMAND-PARITY.md', 'src/index.js', 'src/server.js', 'src/native.js']
          for (const path of paths) {
            const data = readFileSync(path)
            const expected = createHash('sha1').update(`blob ${data.length}\0`).update(data).digest('hex')
            const response = await fetch('https://api.github.com/repos/ByBrawe/opencode-loop/git/blobs', { method: 'POST', headers: { Authorization: `Bearer ${process.env.GH_TOKEN}`, 'Content-Type': 'application/json' }, body: JSON.stringify({ content: data.toString('base64'), encoding: 'base64' }) })
            if (!response.ok) throw new Error(`blob HTTP ${response.status}`)
            const blob = await response.json()
            if (blob.sha !== expected) throw new Error('verified source digest mismatch')
            console.log(`VERIFIED_FILE ${path} ${blob.sha}`)
          }
          console.log(`CHECKOUT ${process.env.GITHUB_SHA}; GOAL da4b1c1745e4fa76cf38f982c9582adf880fc7eb`)
          JS
