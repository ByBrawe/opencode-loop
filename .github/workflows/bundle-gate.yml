name: Single-file Bundle Gate

on:
  pull_request:
    paths:
      - "src/source/**"
      - "scripts/host-*-canary.mjs"
      - "package.json"
      - ".github/workflows/bundle-gate.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundled-host:
    name: bundled Loop host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      - name: Verify npm prepack build path
        if: matrix.os == 'ubuntu-latest'
        run: npm pack --dry-run

      - name: Build a single-file stable plugin from source
        run: npm run build:plugin

      - name: One-shot sync generated stable bundle to feature branch
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          if git diff --quiet -- src/index.js; then
            echo "Stable bundle already matches modular source."
            exit 0
          fi
          git add src/index.js
          git config user.name "OpenCode Loop CI"
          git config user.email "opencode-loop-ci@example.invalid"
          git commit -m "build: sync network recovery stable bundle"
          git push origin HEAD:${{ github.head_ref }}

      - name: Require committed stable bundle to match modular source
        run: git diff --exit-code -- src/index.js

      - name: Verify generated entry syntax and import
        run: |
          node --check src/index.js
          bun -e "await import('./src/index.js')"

      - name: Install current OpenCode CLI
        run: npm install --no-save --package-lock=false opencode-ai@latest

      - name: Show OpenCode version
        run: npx --no-install opencode --version

      - name: Verify real-host Loop and QUEUED Goal steering against clean generated bundle
        run: npm run canary:host
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG

      - name: Restore locked test dependencies
        run: npm ci

      - name: Run generated-bundle regression suite
        run: npm test
