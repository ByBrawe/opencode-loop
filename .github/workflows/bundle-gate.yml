name: Single-file Bundle Gate

on:
  pull_request:
    paths:
      - "src/source/**"
      - "package.json"
      - ".github/workflows/bundle-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bundled-host:
    name: bundled Loop host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      - name: Verify npm prepack build path
        if: matrix.os == 'ubuntu-latest'
        run: npm pack --dry-run

      - name: Build a single-file stable plugin from source
        run: npm run build:plugin

      - name: Upload generated entry
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: runtime-observer-generated-index
          path: src/index.js

      - name: Verify generated entry syntax and tests
        run: |
          node --check src/index.js
          npm test
          bun -e "await import('./src/index.js')"

      - name: Install current OpenCode CLI
        run: npm install --no-save --package-lock=false opencode-ai@latest

      - name: Show OpenCode version
        run: npx --no-install opencode --version

      - name: Run real-host canary against generated bundle
        run: node scripts/host-loop-canary.mjs
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
