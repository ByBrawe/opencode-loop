name: Single-file Bundle Gate

on:
  pull_request:
    paths:
      - "src/source/**"
      - "scripts/host-*-canary.mjs"
      - "package.json"
      - ".github/workflows/bundle-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync-feature-server-bundle:
    name: sync feature dual server bundle
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'fix/opencode-2-0-11-plugin-entry'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: npm run build:plugin
      - name: Require stable V1 bundle to remain unchanged
        run: git diff --exit-code -- src/index.js
      - name: Commit generated server bundle when needed
        shell: bash
        run: |
          if git diff --quiet -- src/server.js; then
            echo "src/server.js already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/server.js
          git commit -m "build(plugin): sync dual OpenCode server bundle"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

  bundled-host:
    name: bundled Loop host (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      - name: Verify npm prepack build path
        if: matrix.os == 'ubuntu-latest'
        run: npm pack --dry-run

      - name: Build a single-file stable plugin from source
        run: npm run build:plugin

      - name: Upload generated plugin bundles
        uses: actions/upload-artifact@v4
        with:
          name: generated-loop-bundles-${{ matrix.os }}
          path: |
            src/index.js
            src/server.js
          if-no-files-found: error

      - name: Require committed stable bundles to match modular source
        run: git diff --exit-code -- src/index.js src/server.js

      - name: Verify generated entry syntax and import
        run: |
          node --check src/index.js
          node --check src/server.js
          bun -e "await import('./src/index.js'); const server = await import('./src/server.js'); if (typeof server.default?.server !== 'function' || typeof server.default?.setup !== 'function') throw new Error('dual server entry is invalid')"

      - name: Install current OpenCode CLI
        run: npm install --no-save --package-lock=false opencode-ai@latest

      - name: Show OpenCode version
        run: npx --no-install opencode --version

      - name: Verify real-host Loop and QUEUED Goal steering against clean generated bundle
        run: npm run canary:host
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG

      - name: Restore locked test dependencies
        run: npm ci

      - name: Run generated-bundle regression suite
        run: npm test
