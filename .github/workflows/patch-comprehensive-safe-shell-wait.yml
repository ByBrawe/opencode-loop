name: Patch comprehensive safe-shell wait

on:
  push:
    branches:
      - fix/stable-status-no-now-due
    paths:
      - ".github/workflows/patch-comprehensive-safe-shell-wait.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: fix/stable-status-no-now-due
      - name: Replace fixed read with bounded state wait
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/comprehensive-test.mjs')
          s = p.read_text()
          old = '''    await h.command("loop-now", "shell")\n    const separateFlagsState = await h.readState()\n    assert.equal(h.records.shells.length, 0)\n    assert.equal(separateFlagsState.jobs[0].lastFailureReason, "safe_shell_blocked", "separate rm -r -f flags must be blocked")\n'''
          new = '''    await h.command("loop-now", "shell")\n    const separateFlagsState = await waitForValue(async () => {\n      const candidate = await h.readState()\n      return candidate.jobs[0]?.lastFailureReason === "safe_shell_blocked" ? candidate : undefined\n    }, 2_000)\n    assert.equal(h.records.shells.length, 0)\n    assert.equal(separateFlagsState?.jobs[0]?.lastFailureReason, "safe_shell_blocked", "separate rm -r -f flags must be blocked")\n'''
          if old not in s:
              raise SystemExit('safe-shell assertion block not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit patch and remove helper
        run: |
          rm .github/workflows/patch-comprehensive-safe-shell-wait.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/comprehensive-test.mjs .github/workflows/patch-comprehensive-safe-shell-wait.yml
          git commit -m "test: wait for safe-shell scheduler state"
          git push origin HEAD:fix/stable-status-no-now-due
