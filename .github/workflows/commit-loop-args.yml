name: Commit Loop Args Refactor

on:
  push:
    branches: [refactor-loop-args]
    paths:
      - ".github/workflows/commit-loop-args.yml"

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor-loop-args
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: npm ci
      - run: node scripts/refactor-loop-args.mjs
      - run: npm run build:plugin
      - run: npm run check
      - run: npm test
      - uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs')
            const files = ['src/source/core/args.js', 'src/source/legacy-v1.js', 'src/index.js']
            for (const path of files) {
              let sha
              try {
                const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'refactor-loop-args' })
                sha = current.data.sha
              } catch (error) {
                if (error.status !== 404) throw error
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                branch: 'refactor-loop-args',
                message: 'refactor: extract loop argument parser',
                content: fs.readFileSync(path).toString('base64'),
                ...(sha ? { sha } : {}),
              })
            }
