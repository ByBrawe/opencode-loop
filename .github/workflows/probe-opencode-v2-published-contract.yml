name: Probe Published OpenCode V2 Contract

on:
  push:
    branches: [probe-opencode-v2-published-contract]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install published V2 plugin package
        run: npm install --ignore-scripts --no-package-lock --no-save @opencode-ai/plugin@next
      - name: Show published package version
        run: node --input-type=module -e "const p=JSON.parse(await (await import('node:fs/promises')).readFile('node_modules/@opencode-ai/plugin/package.json','utf8')); console.log(p.version); console.log(JSON.stringify(p.exports,null,2))"
      - name: Show published Promise runtime contract
        run: |
          for file in index plugin types registration session event tool shell command; do
            echo "===== $file.d.ts ====="
            cat "node_modules/@opencode-ai/plugin/dist/promise/$file.d.ts"
          done
      - name: Show published Effect runtime contract
        run: |
          for file in index plugin session event tool shell command; do
            echo "===== effect/$file.d.ts ====="
            cat "node_modules/@opencode-ai/plugin/dist/effect/$file.d.ts"
          done
