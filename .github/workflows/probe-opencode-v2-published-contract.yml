name: Probe Published OpenCode V2 Contract

on:
  push:
    branches: [probe-opencode-v2-published-contract]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install published V2 plugin package
        run: npm install --ignore-scripts --no-package-lock --no-save @opencode-ai/plugin@next
      - name: Show published package version
        run: node --input-type=module -e "const p=JSON.parse(await (await import('node:fs/promises')).readFile('node_modules/@opencode-ai/plugin/package.json','utf8')); console.log(p.version); console.log(JSON.stringify(p.exports,null,2))"
      - name: Show published Promise context declaration
        run: |
          find node_modules/@opencode-ai/plugin -type f | sort
          find node_modules/@opencode-ai/plugin -type f -name '*context*.d.ts' -print -exec cat {} \;
      - name: Show published Promise entry declaration
        run: find node_modules/@opencode-ai/plugin -type f -path '*v2*promise*' -name '*.d.ts' -maxdepth 8 -print -exec cat {} \;
