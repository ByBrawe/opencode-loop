name: Temporary V2 checklist bundle refresh
on:
  push:
    branches: [fix/v2-checklist-stop-20261019]
    paths:
      - '.github/workflows/checklist-bundle-refresh.yml'

permissions:
  contents: write

jobs:
  rebuild-bundles:
    if: github.repository == 'ByBrawe/opencode-loop' && github.ref == 'refs/heads/fix/v2-checklist-stop-20261019'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - run: npm run build:plugin
      - name: Commit exact generated source bundles to feature branch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src/index.js src/server.js src/native.js
          if git diff --cached --quiet; then
            echo "Bundled files already synchronized."
          else
            git commit -m "build(loop): synchronize V2 checklist native/legacy bundles (#174)"
            git push origin HEAD:fix/v2-checklist-stop-20261019
          fi
