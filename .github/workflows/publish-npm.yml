name: Publish to npm

on:
  push:
    branches: [main]
    paths: [.github/npm-release.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  native-regressions:
    if: github.repository == 'ByBrawe/opencode-loop' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: node scripts/native-release.mjs validate
      - run: npm ci
      - run: npm run build:plugin
      - run: git diff --exit-code -- src/index.js src/server.js src/native.js
      - run: npm run check
      - run: npm test
      - name: Strict clean packaged npm consumer on Windows and Linux
        env:
          OPENCODE_PACKAGE_SMOKE_REQUIRE_INSTALL: '1'
        run: npm run package:smoke

  real-native-loop:
    if: github.repository == 'ByBrawe/opencode-loop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - run: npm ci
      - name: Install actual Loop tarball and exact native host without Goal
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/packed" "$RUNNER_TEMP/consumer"
          npm pack --pack-destination "$RUNNER_TEMP/packed"
          (cd "$RUNNER_TEMP/consumer" && npm init -y >/dev/null && npm install --omit=dev --omit=peer --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/packed/bybrawe-opencode-loop-0.6.9.tgz")
          npm install --prefix "$RUNNER_TEMP/native-host" --package-lock=false @opencode/cli@2.0.18
      - name: Real OpenCode with standalone Loop commands and daemon
        shell: bash
        run: |
          export OPENCODE2_BINARY="$RUNNER_TEMP/native-host/node_modules/.bin/opencode2"
          test "$("$OPENCODE2_BINARY" --version)" = 'opencode v2.0.18'
          export OPENCODE2_CURRENT_COMMAND_FIELDS=1 OPENCODE2_NATIVE_REQUIRED=1
          node "$RUNNER_TEMP/consumer/node_modules/@bybrawe/opencode-loop/scripts/opencode2-loop-canary.mjs"
          node "$RUNNER_TEMP/consumer/node_modules/@bybrawe/opencode-loop/scripts/native-cli-host-canary.mjs"

  publish:
    needs: [native-regressions, real-native-loop]
    if: github.repository == 'ByBrawe/opencode-loop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source belongs to main
        shell: bash
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: node scripts/native-release.mjs validate
      - name: Require exact-main CI in addition to installed-package release jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/native-release.mjs ci
      - name: Verify trusted npm runtime
        run: |
          node --version
          npm --version
          node -e 'const v=require("child_process").execFileSync("npm",["--version"],{encoding:"utf8"}).trim().split(".").map(Number); if(v[0]<11 || (v[0]===11 && (v[1]<5 || (v[1]===5 && v[2]<1)))) throw Error("npm >=11.5.1 required")'
      - run: npm ci
      - run: npm pack --dry-run
      - name: Decide whether npm publish is needed
        id: npm-state
        run: node scripts/native-release.mjs decide
      - name: Publish package to npm
        if: steps.npm-state.outputs.publish == 'true'
        run: npm publish --access public --tag latest
      - name: Verify published version is readable from npm
        shell: bash
        run: |
          for attempt in {1..60}; do
            if node scripts/native-release.mjs verify; then break; fi
            test "$attempt" != 60
            sleep 10
          done
      - name: Clean published Loop-only consumer and actual host
        shell: bash
        run: |
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          (cd "$VERIFY_DIR" && npm init -y >/dev/null)
          # A released version may reach registry metadata before tarballs converge.
          for attempt in {1..12}; do
            if (cd "$VERIFY_DIR" && npm install --omit=dev --omit=peer --ignore-scripts --no-audit --no-fund --prefer-online --cache "$VERIFY_DIR/npm-cache-$attempt" @bybrawe/opencode-loop@0.6.9); then
              break
            fi
            if [ "$attempt" -eq 12 ]; then
              echo "Published Loop standalone clean-install validation did not converge after 12 attempts" >&2
              exit 1
            fi
            rm -rf "$VERIFY_DIR/node_modules" "$VERIFY_DIR/package-lock.json"
            sleep 10
          done
          npm install --prefix "$VERIFY_DIR/host" --package-lock=false @opencode/cli@2.0.18
          export OPENCODE2_BINARY="$VERIFY_DIR/host/node_modules/.bin/opencode2"
          export OPENCODE2_CURRENT_COMMAND_FIELDS=1 OPENCODE2_NATIVE_REQUIRED=1
          node "$VERIFY_DIR/node_modules/@bybrawe/opencode-loop/scripts/opencode2-loop-canary.mjs"
          node "$VERIFY_DIR/node_modules/@bybrawe/opencode-loop/scripts/native-cli-host-canary.mjs"
          echo 'PUBLISHED_NATIVE_LOOP_PASS Loop 0.6.9 on OpenCode 2.0.18'

  github-release:
    name: Create tag and GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create or verify the immutable release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_SHA="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          const base = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }
          const response = await fetch(base + '/git/ref/tags/v0.6.9', { headers })
          if (response.ok) {
            let object = (await response.json()).object
            if (object.type === 'tag') {
              const tag = await fetch(base + '/git/tags/' + object.sha, { headers })
              assert.ok(tag.ok); object = (await tag.json()).object
            }
            assert.equal(object.type, 'commit')
            assert.equal(object.sha, process.env.GITHUB_SHA, 'Existing release tag belongs to another source')
          } else {
            assert.equal(response.status, 404)
            const created = await fetch(base + '/git/refs', { method: 'POST', headers, body: JSON.stringify({ ref: 'refs/tags/v0.6.9', sha: process.env.GITHUB_SHA }) })
            assert.equal(created.status, 201)
          }
          JS
          if ! gh release view v0.6.9 >/dev/null 2>&1; then
            git archive --format=zip --output=opencode-loop.zip "$COMMIT_SHA"
            gh release create v0.6.9 opencode-loop.zip --title v0.6.9 --notes-file examples/OPENCODE2-0.6.9.md --verify-tag
          fi
