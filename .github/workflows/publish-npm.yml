name: Publish to npm

on:
  push:
    branches: [main]
    paths: [.github/npm-release.json]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  native-regressions:
    if: github.repository == 'ByBrawe/opencode-loop' && github.ref == 'refs/heads/main'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: '1.4.2'
      - run: node scripts/native-release.mjs validate
      - run: npm ci
      - run: npm run build:plugin
      - run: git diff --exit-code -- src/index.js src/server.js src/native.js
      - run: npm run check
      - run: npm test
      - run: npm run package:smoke

  real-native-pair:
    if: github.repository == 'ByBrawe/opencode-loop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Validate and resolve immutable release companion
        id: release
        shell: bash
        run: |
          node scripts/native-release.mjs validate
          node --input-type=module <<'JS'
          import { readFileSync, appendFileSync } from 'node:fs'
          const release = JSON.parse(readFileSync('.github/npm-release.json', 'utf8'))
          if (!/^[a-f0-9]{40}$/.test(release.goal.sha)) throw new Error('Invalid Goal source identity')
          appendFileSync(process.env.GITHUB_OUTPUT, `goal_sha=${release.goal.sha}\n`)
          JS
      - run: npm ci
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: ByBrawe/opencode-goal
          ref: ${{ steps.release.outputs.goal_sha }}
          path: companion-goal
          persist-credentials: false
      - name: Build the declared Goal companion
        shell: bash
        run: |
          test "$(git -C companion-goal rev-parse HEAD)" = "$(node -p "require('./.github/npm-release.json').goal.sha")"
          (cd companion-goal && npm install --no-save --legacy-peer-deps @opencode/plugin@2.0.22 && node -e "if (require('./node_modules/@opencode/plugin/package.json').version !== '2.0.22') process.exit(1)" && npm run build)
      - name: Install actual production tarballs and exact native host
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/packed" "$RUNNER_TEMP/consumer"
          npm pack --pack-destination "$RUNNER_TEMP/packed"
          (cd companion-goal && npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP/packed")
          (cd "$RUNNER_TEMP/consumer" && npm init -y >/dev/null && npm install --omit=dev --omit=peer --ignore-scripts --no-audit --no-fund "$RUNNER_TEMP/packed/bybrawe-opencode-loop-0.6.6.tgz" "$RUNNER_TEMP/packed/bybrawe-opencode-goal-1.3.47.tgz")
          npm install --prefix "$RUNNER_TEMP/native-host" --package-lock=false @opencode/cli@2.0.18
      - name: Real OpenCode with both installed packages, command presets and daemon
        shell: bash
        run: |
          export OPENCODE2_BINARY="$RUNNER_TEMP/native-host/node_modules/.bin/opencode2"
          test "$("$OPENCODE2_BINARY" --version)" = 'opencode v2.0.18'
          export OPENCODE_GOAL_INSTALLER="$RUNNER_TEMP/consumer/node_modules/@bybrawe/opencode-goal/dist/install.js"
          export OPENCODE_GOAL_V2_PLUGIN_URL="file://$RUNNER_TEMP/consumer/node_modules/@bybrawe/opencode-goal/dist/server.js"
          export OPENCODE2_CURRENT_COMMAND_FIELDS=1 OPENCODE2_NATIVE_REQUIRED=1
          node "$RUNNER_TEMP/consumer/node_modules/@bybrawe/opencode-loop/scripts/native-install-pair-test.mjs"
          node "$RUNNER_TEMP/consumer/node_modules/@bybrawe/opencode-loop/scripts/opencode2-loop-canary.mjs"
          node "$RUNNER_TEMP/consumer/node_modules/@bybrawe/opencode-loop/scripts/native-cli-host-canary.mjs"
          (cd companion-goal && node scripts/opencode2-unit-handoff-canary.mjs && node scripts/native-status-host-canary.mjs)

  publish:
    needs: [native-regressions, real-native-pair]
    if: github.repository == 'ByBrawe/opencode-loop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release source belongs to main
        shell: bash
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - run: node scripts/native-release.mjs validate
      - name: Require exact-main CI in addition to installed-package release jobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/native-release.mjs ci
      - name: Verify trusted npm runtime
        run: |
          node --version
          npm --version
          node -e 'const v=require("child_process").execFileSync("npm",["--version"],{encoding:"utf8"}).trim().split(".").map(Number); if(v[0]<11 || (v[0]===11 && (v[1]<5 || (v[1]===5 && v[2]<1)))) throw Error("npm >=11.5.1 required")'
      - run: npm ci
      - run: npm pack --dry-run
      - name: Decide whether npm publish is needed
        id: npm-state
        run: node scripts/native-release.mjs decide
      - name: Publish package to npm
        if: steps.npm-state.outputs.publish == 'true'
        run: npm publish --access public --tag latest
      - name: Verify published version is readable from npm
        shell: bash
        run: |
          for attempt in {1..60}; do
            if node scripts/native-release.mjs verify; then break; fi
            test "$attempt" != 60
            sleep 10
          done
      - name: Clean published consumer and actual host
        shell: bash
        run: |
          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "$VERIFY_DIR"' EXIT
          (cd "$VERIFY_DIR" && npm init -y >/dev/null && npm install --omit=dev --omit=peer --ignore-scripts --no-audit --no-fund @bybrawe/opencode-loop@0.6.6 @bybrawe/opencode-goal@1.3.47)
          npm install --prefix "$VERIFY_DIR/host" --package-lock=false @opencode/cli@2.0.18
          export OPENCODE2_BINARY="$VERIFY_DIR/host/node_modules/.bin/opencode2"
          export OPENCODE_GOAL_INSTALLER="$VERIFY_DIR/node_modules/@bybrawe/opencode-goal/dist/install.js"
          export OPENCODE_GOAL_V2_PLUGIN_URL="file://$VERIFY_DIR/node_modules/@bybrawe/opencode-goal/dist/server.js"
          export OPENCODE2_CURRENT_COMMAND_FIELDS=1 OPENCODE2_NATIVE_REQUIRED=1
          node "$VERIFY_DIR/node_modules/@bybrawe/opencode-loop/scripts/native-install-pair-test.mjs"
          node "$VERIFY_DIR/node_modules/@bybrawe/opencode-loop/scripts/opencode2-loop-canary.mjs"
          node "$VERIFY_DIR/node_modules/@bybrawe/opencode-loop/scripts/native-cli-host-canary.mjs"
          echo 'PUBLISHED_NATIVE_PAIR_PASS Loop 0.6.5 + Goal 1.3.44 on OpenCode 2.0.18'

  github-release:
    name: Create tag and GitHub release
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create or verify the immutable release tag
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          COMMIT_SHA="$GITHUB_SHA"
          test "$(git rev-parse HEAD)" = "$COMMIT_SHA"
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict'
          const base = 'https://api.github.com/repos/' + process.env.GITHUB_REPOSITORY
          const headers = { Authorization: `Bearer ${process.env.GH_TOKEN}`, Accept: 'application/vnd.github+json', 'Content-Type': 'application/json' }
          const response = await fetch(base + '/git/ref/tags/v0.6.5', { headers })
          if (response.ok) {
            let object = (await response.json()).object
            if (object.type === 'tag') {
              const tag = await fetch(base + '/git/tags/' + object.sha, { headers })
              assert.ok(tag.ok); object = (await tag.json()).object
            }
            assert.equal(object.type, 'commit')
            assert.equal(object.sha, process.env.GITHUB_SHA, 'Existing release tag belongs to another source')
          } else {
            assert.equal(response.status, 404)
            const created = await fetch(base + '/git/refs', { method: 'POST', headers, body: JSON.stringify({ ref: 'refs/tags/v0.6.5', sha: process.env.GITHUB_SHA }) })
            assert.equal(created.status, 201)
          }
          JS
          if ! gh release view v0.6.5 >/dev/null 2>&1; then
            git archive --format=zip --output=opencode-loop.zip "$COMMIT_SHA"
            gh release create v0.6.5 opencode-loop.zip --title v0.6.5 --notes-file examples/OPENCODE2-0.6.5.md --verify-tag
          fi
