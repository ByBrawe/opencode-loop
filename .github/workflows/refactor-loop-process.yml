name: Verify Process Split
on:
  push:
    branches: [refactor-loop-process]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor-loop-process
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: node scripts/refactor-loop-process.mjs
      - run: node --check src/source/core/process.js
      - run: npm run build:plugin
      - run: npm run check
      - run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: process-split
          path: |
            src/source/core/process.js
            src/source/legacy-v1.js
            src/index.js
