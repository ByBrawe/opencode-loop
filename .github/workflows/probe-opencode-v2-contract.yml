name: Probe OpenCode V2 Contract

on:
  push:
    branches: [probe-opencode-v2-agent-activation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install current V2 CLI
        run: npm install -g @opencode-ai/cli@next
      - name: Show V2 version
        run: opencode2 --version
      - name: Warm V2 agent domain
        working-directory: .v2-probe
        run: opencode2 api -H "x-opencode-directory:$(pwd)" get /api/agent
      - name: Read V2 agents after plugin setup
        working-directory: .v2-probe
        run: opencode2 api -H "x-opencode-directory:$(pwd)" get /api/agent | tee agent-list.txt
      - name: Require Loop V2 activation marker
        working-directory: .v2-probe
        run: grep -F "LOOP_V2_PROBE_ACTIVE" agent-list.txt
