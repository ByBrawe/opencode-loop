name: Probe OpenCode V2 Contract

on:
  push:
    branches: [probe-opencode-v2-root-command]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install current V2 CLI
        run: npm install -g @opencode-ai/cli@next
      - name: Show V2 version
        run: opencode2 --version
      - name: Read canonical project commands
        shell: bash
        run: |
          opencode2 api -H "x-opencode-directory:$(pwd)" get /api/command > command-list.txt
          cat command-list.txt
      - name: Require seed command
        run: grep -F "V2 activation seed" command-list.txt
      - name: Require Loop V2 activation marker
        run: grep -F "LOOP_V2_PROBE_ACTIVE" command-list.txt
