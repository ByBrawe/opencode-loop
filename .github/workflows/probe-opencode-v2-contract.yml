name: Probe OpenCode V2 Contract

on:
  push:
    branches: [probe-opencode-v2-command-activation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install current V2 CLI
        run: npm install -g @opencode-ai/cli@next
      - name: Show V2 version
        run: opencode2 --version
      - name: Verify command transform on registered V2 daemon
        working-directory: .v2-probe
        shell: bash
        run: |
          for attempt in $(seq 1 12); do
            opencode2 api -H "x-opencode-directory:$(pwd)" get /api/command > command-list.txt
            grep -F "v2-probe" command-list.txt
            if grep -F "LOOP_V2_PROBE_ACTIVE" command-list.txt; then
              exit 0
            fi
            node -e "setTimeout(() => {}, 500)"
          done
          cat command-list.txt
          exit 1
