name: Probe OpenCode V2 Contract

on:
  push:
    branches: [probe-opencode-v2-root-command]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install current V2 CLI
        run: npm install -g @opencode-ai/cli@next
      - name: Show V2 version
        run: opencode2 --version
      - name: Show resolved V2 config
        run: opencode2 debug config
      - name: Probe external plugin on foreground V2 host
        shell: bash
        run: |
          OPENCODE_SERVER_PASSWORD=probe opencode2 serve --hostname 127.0.0.1 --port 4096 > server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 20); do
            if curl -fsS -u opencode:probe http://127.0.0.1:4096/api/health >/dev/null; then ready=1; break; fi
            node -e "setTimeout(() => {}, 500)"
          done
          if [ "$ready" -ne 1 ]; then
            cat server.log
            exit 1
          fi
          for attempt in $(seq 1 20); do
            curl -fsS -u opencode:probe -H "x-opencode-directory:$(pwd)" http://127.0.0.1:4096/api/command > command-list.txt
            if grep -F "LOOP_V2_PROBE_ACTIVE" command-list.txt; then
              cat command-list.txt
              exit 0
            fi
            node -e "setTimeout(() => {}, 500)"
          done
          cat command-list.txt
          cat server.log
          exit 1
