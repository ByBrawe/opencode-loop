name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      - run: npm run check

      - run: npm test

      - name: Verify Bun can load the plugin
        run: bun -e "await import('./src/index.js')"

      # Issue #2 happened in the installer-created .ts plugin shape, not the source .js file.
      - name: "Regression #2 - verify local .ts plugin loads in Bun"
        run: |
          node -e "require('node:fs').copyFileSync('src/index.js', 'src/__opencode_loop_local_ci.ts')"
          bun -e "await import('./src/__opencode_loop_local_ci.ts')"
          node -e "require('node:fs').rmSync('src/__opencode_loop_local_ci.ts', { force: true })"

  opencode-peer-compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin-version: ["1.4.0", "latest"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      - name: Install OpenCode plugin compatibility target
        shell: bash
        run: npm install --no-save --package-lock=false "@opencode-ai/plugin@${{ matrix.plugin-version }}"

      - name: Show tested OpenCode plugin version
        run: node -p "require('./node_modules/@opencode-ai/plugin/package.json').version"

      - run: npm run check

      - run: npm test

      - name: Verify Bun can load with this OpenCode plugin
        run: bun -e "await import('./src/index.js')"

      - name: "Regression #2 - verify local .ts plugin loads with this OpenCode plugin"
        run: |
          node -e "require('node:fs').copyFileSync('src/index.js', 'src/__opencode_loop_local_ci.ts')"
          bun -e "await import('./src/__opencode_loop_local_ci.ts')"
          node -e "require('node:fs').rmSync('src/__opencode_loop_local_ci.ts', { force: true })"
