name: CI

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      - name: Verify shadow OpenCode host bridge parity
        run: |
          node --check src/source/opencode/host.js
          node --check scripts/host-bridge-parity-test.mjs
          node scripts/host-bridge-parity-test.mjs

      - run: npm run check

      - name: Installer regression
        run: node scripts/install-test.mjs
        timeout-minutes: 2

      - name: Daemon regression
        run: node scripts/loopd-test.mjs
        timeout-minutes: 2

      - name: Plugin smoke regression
        run: node scripts/smoke-test.mjs
        timeout-minutes: 2

      - name: Host adapter contract
        run: node scripts/host-adapter-contract-test.mjs
        timeout-minutes: 2

      - name: Comprehensive regression
        run: node scripts/comprehensive-watchdog.mjs
        timeout-minutes: 2

      - name: Verify Bun can load the plugin
        run: bun -e "await import('./src/index.js')"

      # Issue #2 happened in the installer-created .ts plugin shape, not the source .js file.
      - name: "Regression #2 - verify local .ts plugin loads in Bun"
        run: |
          node -e "require('node:fs').copyFileSync('src/index.js', 'src/__opencode_loop_local_ci.ts')"
          bun -e "await import('./src/__opencode_loop_local_ci.ts')"
          node -e "require('node:fs').rmSync('src/__opencode_loop_local_ci.ts', { force: true })"

  opencode-peer-compat:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        plugin-version: ["1.4.0", "latest"]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      - name: Install OpenCode plugin compatibility target
        shell: bash
        run: npm install --no-save --package-lock=false "@opencode-ai/plugin@${{ matrix.plugin-version }}"

      - name: Show tested OpenCode plugin version
        run: node -p "require('./node_modules/@opencode-ai/plugin/package.json').version"

      - run: npm run check

      - name: Installer regression
        run: node scripts/install-test.mjs
        timeout-minutes: 2

      - name: Daemon regression
        run: node scripts/loopd-test.mjs
        timeout-minutes: 2

      - name: Plugin smoke regression
        run: node scripts/smoke-test.mjs
        timeout-minutes: 2

      - name: Host adapter contract
        run: node scripts/host-adapter-contract-test.mjs
        timeout-minutes: 2

      - name: Comprehensive regression
        run: node scripts/comprehensive-watchdog.mjs
        timeout-minutes: 2

      - name: Verify Bun can load with this OpenCode plugin
        run: bun -e "await import('./src/index.js')"

      - name: "Regression #2 - verify local .ts plugin loads with this OpenCode plugin"
        run: |
          node -e "require('node:fs').copyFileSync('src/index.js', 'src/__opencode_loop_local_ci.ts')"
          bun -e "await import('./src/__opencode_loop_local_ci.ts')"
          node -e "require('node:fs').rmSync('src/__opencode_loop_local_ci.ts', { force: true })"

  real-opencode-loop:
    name: real OpenCode loop (${{ matrix.os }})
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: npm ci

      - name: Install current OpenCode CLI
        run: npm install --no-save --package-lock=false opencode-ai@latest

      - name: Show OpenCode version
        run: npx --no-install opencode --version

      - name: Run real-host Loop canary
        run: node scripts/host-loop-canary.mjs
        env:
          OPENCODE_PRINT_LOGS: "1"
          OPENCODE_LOG_LEVEL: DEBUG
