name: One-shot prepare 0.5.35 release metadata

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'release/0.5.35-prep'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: release/0.5.35-prep
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Update package, lock, README, and changelog
        shell: bash
        run: |
          npm version 0.5.35 --no-git-tag-version
          node <<'NODE'
          const fs = require('fs')
          const readmePath = 'README.md'
          let readme = fs.readFileSync(readmePath, 'utf8')
          readme = readme.replace('Current stable release: `0.5.34`', 'Current stable release: `0.5.35`')
          fs.writeFileSync(readmePath, readme)

          const changelogPath = 'CHANGELOG.md'
          let changelog = fs.readFileSync(changelogPath, 'utf8')
          const marker = '# Changelog\n'
          const entry = `\n## 0.5.35\n\n- Treat OpenCode \`session.status=retry\` as authoritative provider ownership: retry and unreadable status can no longer age into idle and cause an overlapping Loop turn; a genuinely completed current assistant message can still release stale retry safely.\n- Recover transient Loop-owned network/provider failures with bounded exponential backoff (5s to 60s), refund failed infrastructure attempts from \`runCount\`/\`lastRunAt\`, re-enable jobs that only hit \`--max-runs\` because of the failed attempt, and keep infrastructure failures separate from ordinary \`failureCount\`.\n- Add a two-minute watchdog for an explicitly stuck OpenCode retry, scoped only to a Loop-owned active turn: abort that owned retry, refund the logical run, and reschedule with backoff without touching unrelated foreground/user work. Successful normal turns reset the consecutive network-backoff counter.\n- Preserve plain \`/loop devam et\` as intentionally unlimited, while explicit completion-bounded idle loops such as \`bitene kadar\`, \`projeyi bitir\`, and \`until done\` now auto-pause only after two consecutive current assistant replies both report verified completion and no remaining work. Replies naming next/remaining work reset the terminal signal.\n- Make Turkish terminal/no-work detection Unicode-safe, expand outage/terminal regressions, keep the generated single-file stable bundle synchronized with modular source, and document retry, backoff, watchdog, and completion-bounded scheduling behavior in \`docs/SCHEDULING.md\`.\n`
          if (!changelog.includes('## 0.5.35')) changelog = changelog.replace(marker, marker + entry)
          fs.writeFileSync(changelogPath, changelog)
          NODE
      - name: Commit generated release metadata
        shell: bash
        run: |
          git add package.json package-lock.json README.md CHANGELOG.md
          if git diff --cached --quiet; then
            echo 'Release metadata already prepared.'
            exit 0
          fi
          git config user.name 'OpenCode Loop CI'
          git config user.email 'opencode-loop-ci@example.invalid'
          git commit -m 'release: prepare 0.5.35'
          git push origin HEAD:release/0.5.35-prep
