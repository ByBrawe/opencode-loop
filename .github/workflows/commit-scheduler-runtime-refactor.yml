name: Commit Scheduler Runtime Refactor
on:
  push:
    branches: [refactor-scheduler-runtime-20260814]
    paths: [.github/workflows/commit-scheduler-runtime-refactor.yml]
permissions:
  contents: write
jobs:
  commit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: refactor-scheduler-runtime-20260814
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: oven-sh/setup-bun@v2
      - run: npm ci
      - run: node scripts/refactor-scheduler-runtime.mjs
      - run: node --check src/source/runtime/scheduler.js
      - run: node --check src/source/legacy-v1.js
      - run: npm run build:plugin
      - run: npm run check
      - run: npm test
      - uses: actions/github-script@v8
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('node:fs')
            for (const path of ['src/source/legacy-v1.js','src/index.js']) {
              const current = await github.rest.repos.getContent({ owner: context.repo.owner, repo: context.repo.repo, path, ref: 'refactor-scheduler-runtime-20260814' })
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                branch: 'refactor-scheduler-runtime-20260814',
                message: 'refactor: extract scheduler runtime',
                content: fs.readFileSync(path).toString('base64'),
                sha: current.data.sha,
              })
            }
