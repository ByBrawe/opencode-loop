name: Validate V2 interval runtime

on:
  push:
    branches: [feat-v2-interval-runtime-20260814]
    paths:
      - .github/workflows/validate-v2-interval-runtime.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: feat-v2-interval-runtime-20260814
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node scripts/v2-prompt-runtime-test.mjs
      - run: node scripts/v2-prompt-interval-test.mjs
      - run: npm test
      - run: git diff --check
