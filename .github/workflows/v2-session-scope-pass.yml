name: V2 session location safety
on:
  push:
    branches: [main]
    paths: [.github/workflows/v2-session-scope-pass.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v2-session-scope-pass
  cancel-in-progress: false
jobs:
  verify:
    if: github.repository == 'ByBrawe/opencode-loop' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - run: npm ci
      - name: Add cross-worktree regression against the actual native plugin
        shell: bash
        run: |
          cat > scripts/native-session-location-test.mjs <<'TEST'
          import test from 'node:test'
          import assert from 'node:assert/strict'
          import { mkdtemp, rm, access, readFile } from 'node:fs/promises'
          import path from 'node:path'
          import os from 'node:os'
          import plugin from '../src/source/opencode2/native-plugin.js'
          import { createNativeLoopRuntime } from '../src/source/opencode2/native-runtime.js'
          
          async function fixture() {
            const directory = await mkdtemp(path.join(os.tmpdir(), 'loop-location-'))
            const foreign = await mkdtemp(path.join(os.tmpdir(), 'loop-foreign-'))
            let session = { id: 'ses_scope', location: { directory } }
            const commands = new Map(), hooks = new Map(), prompts = []
            const ctx = {
              location: { directory }, options: {}, app: { version: '2.0.18' },
              session: {
                get: async () => session,
                prompt: async (input) => { prompts.push(input); return { id: input.id || 'msg_status' } },
                hook: async (name, fn) => { hooks.set(name, fn); return { dispose() { hooks.delete(name) } } },
              },
              command: { transform: async (fn) => { fn({ add(def) { commands.set(def.name, def) } }); return { dispose() {} } } },
              event: { subscribe({ signal }) { return (async function* () { await new Promise((resolve) => { if (signal.aborted) resolve(); else signal.addEventListener('abort', resolve, { once: true }) }) })() } },
            }
            const close = await plugin.setup(ctx)
            return {
              directory, foreign, ctx, commands, hooks, prompts,
              setSession(value) { session = value },
              command(name, text = '') { return commands.get(name).execute({ sessionID: 'ses_scope', prompt: { text } }) },
              async close() { await close(); await rm(directory, { recursive: true, force: true }); await rm(foreign, { recursive: true, force: true }) },
            }
          }
          test('foreign-worktree command cannot create progress in the plugin directory', async () => {
            const f = await fixture()
            try {
              f.setSession({ id: 'ses_scope', location: { directory: f.foreign } })
              await assert.rejects(f.command('loop-init', 'progress.md'), /session.*location|project.*worktree/i)
              await assert.rejects(access(path.join(f.directory, 'progress.md')))
              await assert.rejects(access(path.join(f.foreign, 'progress.md')))
              assert.equal(f.prompts.length, 0)
            } finally { await f.close() }
          })
          test('native command still initializes a confirmed local session', async () => {
            const f = await fixture()
            try {
              await f.command('loop-init', 'progress.md')
              assert.ok((await readFile(path.join(f.directory, 'progress.md'), 'utf8')).length)
              assert.equal(f.prompts.length, 1)
            } finally { await f.close() }
          })
          test('missing, mismatched and unreadable session identity fail closed', async () => {
            const f = await fixture()
            try {
              for (const value of [null, { id: 'ses_other', location: { directory: f.directory } }, { id: 'ses_scope' }, { id: 'ses_scope', location: { directory: f.directory, workspaceID: 'other' } }]) {
                f.setSession(value)
                await assert.rejects(f.command('loop-init'), /session.*location|project.*worktree/i)
              }
              f.ctx.session.get = async () => { throw new Error('session unavailable') }
              await assert.rejects(f.command('loop-init'), /session.*location|project.*worktree/i)
              await assert.rejects(access(path.join(f.directory, 'progress.md')))
            } finally { await f.close() }
          })
          test('scoped runtime refuses persistent commands and timer dispatch when ownership changes', async () => {
            const directory = await mkdtemp(path.join(os.tmpdir(), 'loop-runtime-location-'))
            let allowed = false
            const prompts = [], timers = []
            const runtime = createNativeLoopRuntime({ directory,
              scopeAllowed: async () => allowed,
              prompt: async (input) => { prompts.push(input); return { id: input.id } },
              setTimer(fn) { const timer = { fn }; timers.push(timer); return timer }, clearTimer(timer) { timer.cancelled = true },
            })
            const scope = { directory, sessionID: 'ses_runtime' }
            const command = () => runtime.onEvent({ ...scope, kind: 'command', action: 'executed', name: 'loop', arguments: '1h scoped task --defer' })
            try {
              assert.equal((await command()).accepted, false)
              await assert.rejects(access(path.join(directory, '.opencode')))
              allowed = true
              assert.equal((await command()).accepted, true)
              const file = path.join(directory, '.opencode', 'opencode-loop', 'ses_runtime.json')
              const before = await readFile(file, 'utf8')
              allowed = false
              for (const timer of timers.filter((t) => !t.cancelled)) await timer.fn()
              assert.equal((await runtime.wake(scope)).accepted, false)
              assert.equal(await readFile(file, 'utf8'), before)
              assert.equal(prompts.length, 0)
            } finally { await runtime.dispose(); await rm(directory, { recursive: true, force: true }) }
          })
          TEST
          node --check scripts/native-session-location-test.mjs
      - name: Require the original wrong-directory behavior to be reproduced
        shell: bash
        run: |
          if node --test --test-name-pattern='foreign-worktree command' scripts/native-session-location-test.mjs > "$RUNNER_TEMP/location-before.log" 2>&1; then
            cat "$RUNNER_TEMP/location-before.log"
            echo 'Expected the cross-worktree regression to fail before the fix.'
            exit 1
          fi
          cat "$RUNNER_TEMP/location-before.log"
          grep -q 'Missing expected rejection' "$RUNNER_TEMP/location-before.log"
      - name: Bind commands, hooks, public events and queued work to native session location
        shell: bash
        run: |
          cat > src/source/opencode2/session-location.js <<'JS'
          import path from 'node:path'
          
          // The plugin location is not evidence about an arbitrary session.
          // Resolve through the host before using the instance's local files.
          export function createNativeSessionLocationGuard({ directory, workspaceID, getSession }) {
            const expected = path.resolve(directory)
            return async (sessionID) => {
              if (typeof sessionID !== 'string' || !sessionID || typeof getSession !== 'function') return false
              try {
                const session = await getSession({ sessionID })
                if (session?.id !== sessionID || typeof session.location?.directory !== 'string' || !path.isAbsolute(session.location.directory)) return false
                if (path.relative(expected, path.resolve(session.location.directory)) !== '') return false
                return (session.location.workspaceID ?? '') === (workspaceID ?? '')
              } catch { return false }
            }
          }
          JS
          node --input-type=module <<'JS'
          import fs from 'node:fs'
          function replace(file, before, after) {
            const value = fs.readFileSync(file, 'utf8')
            if (value.split(before).length !== 2) throw new Error(`Unexpected source boundary in ${file}: ${before.slice(0, 70)}`)
            fs.writeFileSync(file, value.replace(before, after))
          }
          const plugin = 'src/source/opencode2/native-plugin.js'
          replace(plugin, 'import path from "node:path"', 'import path from "node:path"\nimport { createNativeSessionLocationGuard } from "./session-location.js"')
          replace(plugin, '    const registrations = []', `    const ownsSession = createNativeSessionLocationGuard({
                directory, workspaceID: ctx.location?.workspaceID,
                getSession: (input) => ctx.session.get(input),
              })
              const registrations = []`)
          replace(plugin, '      directory,\n      prompt,', '      directory,\n      scopeAllowed: (scope) => ownsSession(scope.sessionID),\n      prompt,')
          replace(plugin, 'onEvent: (event) => runtime.onEvent(event), onError:', `onEvent: async (event) => {
                if (event.sessionID && !(event.kind === "session" && event.action === "deleted") && !await ownsSession(event.sessionID)) return
                return runtime.onEvent(event)
              }, onError:`)
          replace(plugin, '      if (closed) throw new Error("Native Loop is disposed")', `      if (closed) throw new Error("Native Loop is disposed")
                if (!await ownsSession(sessionID)) throw new Error("Native Loop cannot resolve this session in the plugin location; use its own project/worktree.")
                if (closed) throw new Error("Native Loop is disposed")`)
          replace(plugin, 'ctx.session.hook("prompt", (event) => {', 'ctx.session.hook("prompt", async (event) => {')
          replace(plugin, '        if (event.metadata?.opencode_loop_v2 === true) return', '        if (closed || event.metadata?.opencode_loop_v2 === true || !await ownsSession(event.sessionID)) return\n        if (closed) return')
          replace(plugin, 'ctx.session.hook("compaction", (event) => runtime.onEvent({ kind: "compaction", action: "started", directory, sessionID: event.sessionID }))', `ctx.session.hook("compaction", async (event) => {
                if (closed || !await ownsSession(event.sessionID)) return
                if (!closed) return runtime.onEvent({ kind: "compaction", action: "started", directory, sessionID: event.sessionID })
              }))`)
          const runtime = 'src/source/opencode2/native-runtime.js'
          replace(runtime, '    const pending = scope.queue.catch(() => {}).then(() => current(scope) ? task() : result({ reason: "disposed" }))', `    const pending = scope.queue.catch(() => {}).then(async () => {
                if (!current(scope)) return result({ reason: "disposed" })
                if (typeof options.scopeAllowed === "function" && !await options.scopeAllowed(scope)) {
                  scope.epoch++
                  clear(scope, "timer"); clear(scope, "deadline"); clear(scope, "companionTimer")
                  return result({ accepted: false, reason: "session-location-mismatch", error: "Native session location cannot be verified for this project/worktree." })
                }
                return current(scope) ? task() : result({ reason: "disposed" })
              })`)
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'))
          pkg.scripts.test = 'node --test scripts/native-session-location-test.mjs && ' + pkg.scripts.test
          pkg.scripts.check += ' && node --check src/source/opencode2/session-location.js && node --check scripts/native-session-location-test.mjs'
          fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n')
          JS
      - name: Build and verify before accepting product changes
        shell: bash
        run: |
          npm run build:plugin
          npm run check > "$RUNNER_TEMP/check.log" 2>&1 || { tail -80 "$RUNNER_TEMP/check.log"; exit 1; }
          npm test > "$RUNNER_TEMP/test.log" 2>&1 || { tail -180 "$RUNNER_TEMP/test.log"; exit 1; }
          tail -45 "$RUNNER_TEMP/test.log"
          npm run package:smoke
      - name: Record scope and proof
        shell: bash
        run: |
          cat > docs/opencode2-session-location.md <<'DOC'
          # Native session location safety
          
          Native commands, including loop-init, verify the session through
          session.get before reading/writing the plugin instance's project files.
          A missing session, a different session ID, a different directory or
          workspace, and a failed lookup are rejected without guessing a path.
          The public event bridge and prompt/compaction hooks ignore foreign
          locations. Queued commands and timer work recheck native location;
          rejected scope clears timers without rewriting the old job snapshot.
          Session-deleted events may retire in-memory state without a lookup.
          
          The native plugin regression reproduced the original wrong-directory
          loop-init write before applying this patch. Permanent tests cover that
          rejection, valid local behavior, unavailable identity and queued work.
          This does not authorize executing foreign worktrees from this instance,
          or claim arbitrary concurrent filesystem moves are transactionally locked.
          
          Official contract: https://opencode.ai/v2/docs/build/plugins/migrate-v1
          DOC
      - name: Commit only verified changes to unchanged main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED=$(git rev-parse HEAD)
          ACTUAL=$(git ls-remote https://github.com/ByBrawe/opencode-loop.git refs/heads/main | cut -f1)
          test "$EXPECTED" = "$ACTUAL"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src scripts/native-session-location-test.mjs package.json docs/opencode2-session-location.md
          git rm .github/workflows/v2-session-scope-pass.yml
          git commit -m 'fix: scope native Loop commands and queued work to host session location'
          ASKPASS="$RUNNER_TEMP/loop-scope-askpass.sh"
          printf '#!/bin/sh\ncase "$1" in *Username*) echo x-access-token ;; *) echo "$GH_TOKEN" ;; esac\n' > "$ASKPASS"
          chmod 700 "$ASKPASS"
          GIT_ASKPASS="$ASKPASS" GIT_TERMINAL_PROMPT=0 git push origin HEAD:refs/heads/main
          rm "$ASKPASS"
          echo "Verified scoped Loop head: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
